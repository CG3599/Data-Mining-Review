<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>用連線讀出社群關係</title><desc>每條線代表兩人互為朋友。乙直接連到甲、丙、丁，所以乙的度數是 3。</desc><path d="M100 80 L250 35" fill="none" stroke="#7196bd" stroke-width="2"/><path d="M100 80 L245 135" fill="none" stroke="#7196bd" stroke-width="2"/><path d="M250 35 L415 90" fill="none" stroke="#7196bd" stroke-width="2"/><path d="M245 135 L250 35" fill="none" stroke="#7196bd" stroke-width="2"/><circle cx="100" cy="80" r="22" fill="#295989"/><text x="100" y="85" fill="#e8f1ff" font-size="16" text-anchor="middle">甲</text><circle cx="250" cy="35" r="22" fill="#295989"/><text x="250" y="40" fill="#e8f1ff" font-size="16" text-anchor="middle">乙</text><circle cx="245" cy="135" r="22" fill="#295989"/><text x="245" y="140" fill="#e8f1ff" font-size="16" text-anchor="middle">丙</text><circle cx="415" cy="90" r="22" fill="#295989"/><text x="415" y="95" fill="#e8f1ff" font-size="16" text-anchor="middle">丁</text></svg>
