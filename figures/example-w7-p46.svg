<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>連續屬性如何用門檻分割</title><desc>把四個年齡排序後，用同一門檻分成兩群。接著比較兩邊的類別純度，判斷這個切分是否有幫助。</desc><path d="M45 90 L488 90" fill="none" stroke="#7196bd" stroke-width="2"/><path d="M262 35 L262 121" fill="none" stroke="#7196bd" stroke-width="2"/><text x="262" y="23" fill="#e8f1ff" font-size="16" text-anchor="middle">門檻 25</text><circle cx="77" cy="90" r="9" fill="#73bafa"/><text x="77" y="126" fill="#e8f1ff" font-size="16" text-anchor="middle">18</text><circle cx="151" cy="90" r="9" fill="#73bafa"/><text x="151" y="126" fill="#e8f1ff" font-size="16" text-anchor="middle">22</text><circle cx="338" cy="90" r="9" fill="#ffbb77"/><text x="338" y="126" fill="#e8f1ff" font-size="16" text-anchor="middle">29</text><circle cx="424" cy="90" r="9" fill="#ffbb77"/><text x="424" y="126" fill="#e8f1ff" font-size="16" text-anchor="middle">34</text><text x="137" y="54" fill="#e8f1ff" font-size="16" text-anchor="middle">年齡 ≤ 25</text><text x="399" y="54" fill="#e8f1ff" font-size="16" text-anchor="middle">年齡 &gt; 25</text></svg>
