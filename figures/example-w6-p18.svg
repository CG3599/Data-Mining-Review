<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>雜湊桶只能先淘汰候選</title><desc>最低支持計數為 3 時，落在桶 0、2 的項目對可淘汰。桶 1 的五次可能來自不同項目對，仍須逐對計數。</desc><text x="75" y="38" fill="#e8f1ff" font-size="16" text-anchor="middle">桶 0</text><rect x="146" y="18" width="110.4" height="27" rx="5" fill="#437bb2"/><text x="478" y="38" fill="#e8f1ff" font-size="16" text-anchor="middle">2 次</text><text x="75" y="89" fill="#e8f1ff" font-size="16" text-anchor="middle">桶 1</text><rect x="146" y="69" width="276" height="27" rx="5" fill="#386f78"/><text x="478" y="89" fill="#e8f1ff" font-size="16" text-anchor="middle">5 次</text><text x="75" y="140" fill="#e8f1ff" font-size="16" text-anchor="middle">桶 2</text><rect x="146" y="120" width="55.2" height="27" rx="5" fill="#386f78"/><text x="478" y="140" fill="#e8f1ff" font-size="16" text-anchor="middle">1 次</text></svg>
