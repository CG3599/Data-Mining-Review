<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>同一筆交易如何進入 FP-Tree</title><desc>假設 B 未達支持門檻，且 A 比 C 常見。移除 B 並依全域頻率排序後，沿 root → A → C 插入。</desc><path d="M100 86 L455 86" fill="none" stroke="#7196bd" stroke-width="2"/><rect x="12" y="65" width="159" height="39" rx="5" fill="#20456c"/><text x="91.5" y="90" fill="#e8f1ff" font-size="16" text-anchor="middle">原交易：C、A、B</text><rect x="195" y="65" width="159" height="39" rx="5" fill="#20456c"/><text x="274.5" y="90" fill="#e8f1ff" font-size="16" text-anchor="middle">篩選：C、A</text><rect x="378" y="65" width="159" height="39" rx="5" fill="#20456c"/><text x="457.5" y="90" fill="#e8f1ff" font-size="16" text-anchor="middle">排序：A、C</text><text x="185" y="91" fill="#e8f1ff" font-size="16" text-anchor="middle">›</text><text x="367" y="91" fill="#e8f1ff" font-size="16" text-anchor="middle">›</text></svg>
