<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>反轉箭頭，信賴度也會改變</title><desc>20 筆交易含 A，40 筆含 B，其中 12 筆同時含兩者。A → B 用 12/20，反向則用 12/40。</desc><text x="75" y="38" fill="#e8f1ff" font-size="16" text-anchor="middle">A → B</text><rect x="146" y="18" width="165.6" height="27" rx="5" fill="#437bb2"/><text x="478" y="38" fill="#e8f1ff" font-size="16" text-anchor="middle">60%</text><text x="75" y="89" fill="#e8f1ff" font-size="16" text-anchor="middle">B → A</text><rect x="146" y="69" width="82.8" height="27" rx="5" fill="#386f78"/><text x="478" y="89" fill="#e8f1ff" font-size="16" text-anchor="middle">30%</text></svg>
