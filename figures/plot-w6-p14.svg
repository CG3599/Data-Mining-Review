<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 302" font-family="Microsoft JhengHei, sans-serif" role="img"><title>候選配對的數量如何成長</title><desc>每新增一個單項，都要與先前每一項配對。從 5 項增至 10 項時，候選配對從 10 對增至 45 對。</desc><rect width="650" height="302" rx="10" fill="#0b1929"/><text x="18" y="30" text-anchor="start" fill="#dceafe" font-size="16">候選配對數</text><text x="344" y="284" text-anchor="middle" fill="#dceafe" font-size="16">頻繁單項數 m</text><line x1="78" y1="67" x2="78" y2="233" stroke="#294059" /><text x="78" y="254" text-anchor="middle" fill="#c9dbef" font-size="14">2</text><line x1="211.5" y1="67" x2="211.5" y2="233" stroke="#294059" /><text x="211.5" y="254" text-anchor="middle" fill="#c9dbef" font-size="14">4</text><line x1="345" y1="67" x2="345" y2="233" stroke="#294059" /><text x="345" y="254" text-anchor="middle" fill="#c9dbef" font-size="14">6</text><line x1="478.5" y1="67" x2="478.5" y2="233" stroke="#294059" /><text x="478.5" y="254" text-anchor="middle" fill="#c9dbef" font-size="14">8</text><line x1="612" y1="67" x2="612" y2="233" stroke="#294059" /><text x="612" y="254" text-anchor="middle" fill="#c9dbef" font-size="14">10</text><line x1="78" y1="233" x2="612" y2="233" stroke="#294059" /><text x="68" y="238" text-anchor="end" fill="#c9dbef" font-size="14">0</text><line x1="78" y1="199.8" x2="612" y2="199.8" stroke="#294059" /><text x="68" y="204.8" text-anchor="end" fill="#c9dbef" font-size="14">10</text><line x1="78" y1="166.6" x2="612" y2="166.6" stroke="#294059" /><text x="68" y="171.6" text-anchor="end" fill="#c9dbef" font-size="14">20</text><line x1="78" y1="133.4" x2="612" y2="133.4" stroke="#294059" /><text x="68" y="138.4" text-anchor="end" fill="#c9dbef" font-size="14">30</text><line x1="78" y1="100.19999999999999" x2="612" y2="100.19999999999999" stroke="#294059" /><text x="68" y="105.19999999999999" text-anchor="end" fill="#c9dbef" font-size="14">40</text><line x1="78" y1="67" x2="612" y2="67" stroke="#294059" /><text x="68" y="72" text-anchor="end" fill="#c9dbef" font-size="14">50</text><line x1="337" y1="25" x2="357" y2="25" stroke="#7dc5ff" stroke-width="3"/><text x="363" y="30" text-anchor="start" fill="#7dc5ff" font-size="14">所有不同配對</text><polyline points="78.00,229.68 144.75,223.04 211.50,213.08 278.25,199.80 345.00,183.20 411.75,163.28 478.50,140.04 545.25,113.48 612.00,83.60" fill="none" stroke="#7dc5ff" stroke-width="3"/><circle cx="78" cy="229.68" r="4" fill="#7dc5ff"/><circle cx="144.75" cy="223.04" r="4" fill="#7dc5ff"/><circle cx="211.5" cy="213.08" r="4" fill="#7dc5ff"/><circle cx="278.25" cy="199.8" r="4" fill="#7dc5ff"/><circle cx="345" cy="183.2" r="4" fill="#7dc5ff"/><circle cx="411.75" cy="163.28" r="4" fill="#7dc5ff"/><circle cx="478.5" cy="140.04" r="4" fill="#7dc5ff"/><circle cx="545.25" cy="113.48" r="4" fill="#7dc5ff"/><circle cx="612" cy="83.6" r="4" fill="#7dc5ff"/><circle cx="612" cy="83.6" r="5" fill="#ffe0a8" stroke="#102037"/><text x="602" y="73.6" text-anchor="end" fill="#ffdaa1" font-size="14">10 項 → 45 對</text></svg>
