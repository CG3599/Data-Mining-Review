<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>訓練、驗證與測試各用在哪裡</title><desc>例如將 1000 筆資料分成 700、150、150 筆。先用驗證集選樹深，選定後才在保留的測試集評估。</desc><path d="M100 86 L455 86" fill="none" stroke="#7196bd" stroke-width="2"/><rect x="12" y="65" width="159" height="39" rx="5" fill="#20456c"/><text x="91.5" y="90" fill="#e8f1ff" font-size="16" text-anchor="middle">訓練集：學參數</text><rect x="195" y="65" width="159" height="39" rx="5" fill="#20456c"/><text x="274.5" y="90" fill="#e8f1ff" font-size="16" text-anchor="middle">驗證集：選模型</text><rect x="378" y="65" width="159" height="39" rx="5" fill="#20456c"/><text x="457.5" y="90" fill="#e8f1ff" font-size="16" text-anchor="middle">測試集：估表現</text><text x="185" y="91" fill="#e8f1ff" font-size="16" text-anchor="middle">›</text><text x="367" y="91" fill="#e8f1ff" font-size="16" text-anchor="middle">›</text></svg>
