<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>同一籃商品算一筆交易</title><desc>三筆交易中，麵包與牛奶各出現兩次，但同籃出現只有一次。計算共同出現次數時，要逐列看。</desc><rect x="14" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="95" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">交易</text><rect x="186" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="267" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">麵包</text><rect x="358" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="439" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">牛奶</text><rect x="14" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">T1</text><rect x="186" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">有</text><rect x="358" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">有</text><rect x="14" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">T2</text><rect x="186" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">有</text><rect x="358" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">無</text><rect x="14" y="125" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="147" fill="#e8f1ff" font-size="16" text-anchor="middle">T3</text><rect x="186" y="125" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="147" fill="#e8f1ff" font-size="16" text-anchor="middle">無</text><rect x="358" y="125" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="147" fill="#e8f1ff" font-size="16" text-anchor="middle">有</text></svg>
