<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>從五數摘要讀出中間一半</title><desc>假設兩端皆無離群值。盒身從 Q1 = 6 到 Q3 = 16，因此四分位距為 10；盒內直線是中位數 10。</desc><path d="M40 85 L490 85" fill="none" stroke="#7196bd" stroke-width="2"/><path d="M40 61 L40 110" fill="none" stroke="#7196bd" stroke-width="2"/><path d="M490 61 L490 110" fill="none" stroke="#7196bd" stroke-width="2"/><rect x="130" y="56" width="225" height="58" rx="5" fill="#20456c"/><path d="M220 56 L220 114" fill="none" stroke="#7196bd" stroke-width="2"/><text x="40" y="145" fill="#e8f1ff" font-size="16" text-anchor="middle">2</text><text x="130" y="145" fill="#e8f1ff" font-size="16" text-anchor="middle">6</text><text x="220" y="145" fill="#e8f1ff" font-size="16" text-anchor="middle">10</text><text x="355" y="145" fill="#e8f1ff" font-size="16" text-anchor="middle">16</text><text x="490" y="145" fill="#e8f1ff" font-size="16" text-anchor="middle">22</text><text x="245" y="35" fill="#e8f1ff" font-size="16" text-anchor="middle">中間 50%</text></svg>
