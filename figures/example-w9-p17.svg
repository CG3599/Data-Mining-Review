<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>案例推理的四個動作</title><desc>依序對應 Retrieve、Reuse、Revise、Retain。修正後的結果會成為下次可以檢索的新案例。</desc><rect x="16" y="13" width="201" height="39" rx="5" fill="#20456c"/><text x="116.5" y="38" fill="#e8f1ff" font-size="16" text-anchor="middle">① 找相似食譜</text><rect x="306" y="13" width="201" height="39" rx="5" fill="#20456c"/><text x="406.5" y="38" fill="#e8f1ff" font-size="16" text-anchor="middle">② 套用舊食譜</text><rect x="306" y="106" width="201" height="39" rx="5" fill="#20456c"/><text x="406.5" y="131" fill="#e8f1ff" font-size="16" text-anchor="middle">③ 調整甜度</text><rect x="16" y="106" width="201" height="39" rx="5" fill="#20456c"/><text x="116.5" y="131" fill="#e8f1ff" font-size="16" text-anchor="middle">④ 保存新食譜</text><text x="259" y="39" fill="#e8f1ff" font-size="16" text-anchor="middle">→</text><text x="405" y="87" fill="#e8f1ff" font-size="16" text-anchor="middle">↓</text><text x="259" y="132" fill="#e8f1ff" font-size="16" text-anchor="middle">←</text><text x="117" y="87" fill="#e8f1ff" font-size="16" text-anchor="middle">↑</text></svg>
