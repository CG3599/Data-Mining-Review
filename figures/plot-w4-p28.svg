<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 302" font-family="Microsoft JhengHei, sans-serif" role="img"><title>提高支持度門檻後，還剩幾個項目集？</title><desc>假設五個項目集的支持度分別是 20%、40%、40%、60%、80%。支持度等於門檻也會保留，剛超過 40% 才會一次少兩個。</desc><rect width="650" height="302" rx="10" fill="#0b1929"/><text x="18" y="30" text-anchor="start" fill="#dceafe" font-size="16">保留的項目集數</text><text x="344" y="284" text-anchor="middle" fill="#dceafe" font-size="16">最低支持度 (%)</text><line x1="78" y1="67" x2="78" y2="233" stroke="#294059" /><text x="78" y="254" text-anchor="middle" fill="#c9dbef" font-size="14">0</text><line x1="184.8" y1="67" x2="184.8" y2="233" stroke="#294059" /><text x="184.8" y="254" text-anchor="middle" fill="#c9dbef" font-size="14">20</text><line x1="291.6" y1="67" x2="291.6" y2="233" stroke="#294059" /><text x="291.6" y="254" text-anchor="middle" fill="#c9dbef" font-size="14">40</text><line x1="398.4" y1="67" x2="398.4" y2="233" stroke="#294059" /><text x="398.4" y="254" text-anchor="middle" fill="#c9dbef" font-size="14">60</text><line x1="505.20000000000005" y1="67" x2="505.20000000000005" y2="233" stroke="#294059" /><text x="505.20000000000005" y="254" text-anchor="middle" fill="#c9dbef" font-size="14">80</text><line x1="612" y1="67" x2="612" y2="233" stroke="#294059" /><text x="612" y="254" text-anchor="middle" fill="#c9dbef" font-size="14">100</text><line x1="78" y1="233" x2="612" y2="233" stroke="#294059" /><text x="68" y="238" text-anchor="end" fill="#c9dbef" font-size="14">0</text><line x1="78" y1="199.8" x2="612" y2="199.8" stroke="#294059" /><text x="68" y="204.8" text-anchor="end" fill="#c9dbef" font-size="14">1</text><line x1="78" y1="166.6" x2="612" y2="166.6" stroke="#294059" /><text x="68" y="171.6" text-anchor="end" fill="#c9dbef" font-size="14">2</text><line x1="78" y1="133.4" x2="612" y2="133.4" stroke="#294059" /><text x="68" y="138.4" text-anchor="end" fill="#c9dbef" font-size="14">3</text><line x1="78" y1="100.19999999999999" x2="612" y2="100.1999999999999