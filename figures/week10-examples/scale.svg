<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">測試資料只套用，不重新估計縮放範圍</title><desc id="desc">自編例：訓練最小值 10、最大值 20，縮放到 [0,1]。測試值 25 轉成 1.5 是合理的超出範圍結果，不應為了塞回 [0,1] 而重新估計測試集的規則。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">測試資料只套用，不重新估計縮放範圍</text><rect x="30" y="80" width="280" height="75" rx="8" fill="#192d46" stroke="#456585"/><text x="170.0" y="111.0" font-size="18" fill="#edf4ff" text-anchor="middle">訓練資料範圍：10–20</text><text x="170.0" y="136.0" font-size="18" fill="#edf4ff" text-anchor="middle">擬合並儲存縮放規則</text><path d="M320,118 L400,118" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M393,113 L400,118 L393,123" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="415" y="80" width="310" height="75" rx="8" fill="#192d46" stroke="#456585"/><text x="570.0" y="111.0" font-size="18" fill="#edf4ff" text-anchor="middle">x′ = (x − 10) / 10</text><text x="570.0" y="136.0" font-size="18" fill="#edf4ff" text-anchor="middle">測試資料套用同一規則</text><rect x="80" y="185" width="240" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="200.0" y="218.5" font-size="18" fill="#edf4ff" text-anchor="middle">測試 x = 15</text><path d="M335,212 L410,212" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M403,207 L410,212 L403,217" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="430" y="185" width="240" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="550.0" y="218.5" font-size="18" fill="#edf4ff" text-anchor="middle">x′ = 0.5</text><rect x="80" y="250" width="240" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="200.0" y="283.5" font-size="18" fill="#edf4ff" text-anchor="middle">測試 x = 25</text><path d="M335,277 L410,277" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M403,272 L410,277 L403,282" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="430" y="250" width="240" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="550.0" y="283.5" font-size="18" fill="#edf4ff" text-anchor="middle">x′ = 1.5</text></g></svg>