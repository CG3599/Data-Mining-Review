<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" role="img" aria-labelledby="title desc"><title id="title">模組度：先數內部邊，再扣掉隨機期望</title><desc id="desc">依教材四點完全圖加三角形的結構重繪。黃色為唯一跨群橋接邊；它也會計入兩端的度數，不能在計算期望值時漏掉。</desc><rect width="760" height="385" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">模組度：先數內部邊，再扣掉隨機期望</text><path d="M100,120 L220,120" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M100,120 L100,250" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M100,120 L220,250" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M220,120 L100,250" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M220,120 L220,250" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M100,250 L220,250" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M220,250 L475,185" fill="none" stroke="#ffd17c" stroke-width="2"/><path d="M475,185 L625,110" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M475,185 L625,260" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M625,110 L625,260" fill="none" stroke="#8ac6ff" stroke-width="2"/><circle cx="100" cy="120" r="23" fill="#193e3b" stroke="#8ac6ff" stroke-width="2"/><text x="100" y="126" font-size="18" fill="#edf4ff" text-anchor="middle">1</text><circle cx="220" cy="120" r="23" fill="#193e3b" stroke="#8ac6ff" stroke-width="2"/><text x="220" y="126" font-size="18" fill="#edf4ff" text-anchor="middle">2</text><circle cx="100" cy="250" r="23" fill="#193e3b" stroke="#8ac6ff" stroke-width="2"/><text x="100" y="256" font-size="18" fill="#edf4ff" text-anchor="middle">3</text><circle cx="220" cy="250" r="23" fill="#193e3b" stroke="#8ac6ff" stroke-width="2"/><text x="220" y="256" font-size="18" fill="#edf4ff" text-anchor="middle">4</text><circle cx="475" cy="185" r="23" fill="#39314e" stroke="#8ac6ff" stroke-width="2"/><text x="475" y="191" font-size="18" fill="#edf4ff" text-anchor="middle">5</text><circle cx="625" cy="110" r="23" fill="#39314e" stroke="#8ac6ff" stroke-width="2"/><text x="625" y="116" font-size="18" fill="#edf4ff" text-anchor="middle">6</text><circle cx="625" cy="260" r="23" fill="#39314e" stroke="#8ac6ff" stroke-width="2"/><text x="625" y="266" font-size="18" fill="#edf4ff" text-anchor="middle">7</text><text x="35" y="305" font-size="18" fill="#edf4ff" text-anchor="start">群 1：內部 6 邊，度數和 13</text><text x="400" y="305" font-size="18" fill="#edf4ff" text-anchor="start">群 2：內部 3 邊，度數和 7</text><text x="55" y="347" font-size="17" fill="#80dfbf" text-anchor="start">共 10 邊；Q = [6/10 − (13/20)²] + [3/10 − (7/20)²] = 0.355</text></g></svg>