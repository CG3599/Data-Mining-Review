<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">選模型看驗證表現，不只看訓練誤差</title><desc id="desc">自編示意曲線，並非教材的實測數據。複雜度增加時訓練誤差持續下降，但驗證誤差可能先降後升；以驗證資料選設定，最終測試集留到最後。</desc><rect width="760" height="380" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">選模型看驗證表現，不只看訓練誤差</text><path d="M90,280 L690,280" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M90,280 L90,80" fill="none" stroke="#8ac6ff" stroke-width="2"/><text x="30" y="85" font-size="17" fill="#edf4ff" text-anchor="start">誤差</text><text x="560" y="318" font-size="17" fill="#edf4ff" text-anchor="start">模型複雜度 →</text><polyline points="100,124.0 170,203.2 240,224.8 310,236.8 380,246.4 450,256.0 520,260.8 590,265.6 660,270.4" fill="none" stroke="#8ac6ff" stroke-width="4"/><text x="530" y="90" font-size="18" fill="#8ac6ff" text-anchor="start">訓練誤差</text><polyline points="100,112.0 170,184.0 240,215.2 310,227.2 380,224.8 450,212.8 520,193.60000000000002 590,164.8 660,128.8" fill="none" stroke="#ffd17c" stroke-width="4"/><text x="530" y="118" font-size="18" fill="#ffd17c" text-anchor="start">驗證誤差</text><path d="M310,90 L310,280" fill="none" stroke="#80dfbf" stroke-width="2" stroke-dasharray="6 5"/><text x="125" y="340" font-size="18" fill="#edf4ff" text-anchor="start">欠擬合</text><text x="285" y="340" font-size="18" fill="#80dfbf" text-anchor="start">合宜</text><text x="570" y="340" font-size="18" fill="#ff9d9d" text-anchor="start">過度擬合</text></g></svg>