<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" role="img" aria-labelledby="title desc"><title id="title">LTM：沿教材例子追蹤活化次序</title><desc id="desc">依教材前四步重繪，僅突顯本次成功活化的鏈。下方比較式為傳入影響與節點門檻，不是成功機率；完整網路仍請對照原始投影片。</desc><rect width="760" height="345" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">LTM：沿教材例子追蹤活化次序</text><path d="M128,145 L245,145" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M238,140 L245,145 L238,150" fill="none" stroke="#8ac6ff" stroke-width="2"/><circle cx="100" cy="145" r="23" fill="#19463e" stroke="#8ac6ff" stroke-width="2"/><text x="100" y="151" font-size="18" fill="#edf4ff" text-anchor="middle">v₁</text><text x="100" y="205" font-size="18" fill="#edf4ff" text-anchor="middle">初始種子</text><text x="100" y="242" font-size="17" fill="#ffd17c" text-anchor="middle">起點</text><path d="M313,145 L430,145" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M423,140 L430,145 L423,150" fill="none" stroke="#8ac6ff" stroke-width="2"/><circle cx="285" cy="145" r="23" fill="#19463e" stroke="#8ac6ff" stroke-width="2"/><text x="285" y="151" font-size="18" fill="#edf4ff" text-anchor="middle">v₃</text><text x="285" y="205" font-size="18" fill="#edf4ff" text-anchor="middle">第 2 步</text><text x="285" y="242" font-size="17" fill="#ffd17c" text-anchor="middle">0.8 ≥ 0.7</text><path d="M498,145 L615,145" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M608,140 L615,145 L608,150" fill="none" stroke="#8ac6ff" stroke-width="2"/><circle cx="470" cy="145" r="23" fill="#19463e" stroke="#8ac6ff" stroke-width="2"/><text x="470" y="151" font-size="18" fill="#edf4ff" text-anchor="middle">v₄</text><text x="470" y="205" font-size="18" fill="#edf4ff" text-anchor="middle">第 3 步</text><text x="470" y="242" font-size="17" fill="#ffd17c" text-anchor="middle">0.1 ≥ 0.09</text><circle cx="655" cy="145" r="23" fill="#19463e" stroke="#8ac6ff" stroke-width="2"/><text x="655" y="151" font-size="18" fill="#edf4ff" text-anchor="middle">v₅</text><text x="655" y="205" font-size="18" fill="#edf4ff" text-anchor="middle">第 4 步</text><text x="655" y="242" font-size="17" fill="#ffd17c" text-anchor="middle">0.6 ≥ 0.4</text><text x="35" y="300" font-size="18" fill="#edf4ff" text-anchor="start">v₂ 未活化：0.5 &lt; 0.8；新活化節點到下一輪才貢獻影響。</text></g></svg>