<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">交集數人頭，聯集不要重複計算</title><desc id="desc">自編具名集合，沿用教材的 3 與 5 位鄰居、交集 2 位之計數。聯集大小為 3+5−2=6；共同鄰居與 Jaccard 的差別在正規化。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">交集數人頭，聯集不要重複計算</text><rect x="30" y="95" width="310" height="100" rx="8" fill="#192d46" stroke="#456585"/><text x="185.0" y="138.5" font-size="18" fill="#edf4ff" text-anchor="middle">N(x) = {a, b, c}</text><text x="185.0" y="163.5" font-size="18" fill="#edf4ff" text-anchor="middle">3 位鄰居</text><rect x="420" y="95" width="310" height="100" rx="8" fill="#192d46" stroke="#456585"/><text x="575.0" y="138.5" font-size="18" fill="#edf4ff" text-anchor="middle">N(y) = {b, c, d, e, f}</text><text x="575.0" y="163.5" font-size="18" fill="#edf4ff" text-anchor="middle">5 位鄰居</text><rect x="130" y="235" width="500" height="70" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="263.5" font-size="18" fill="#edf4ff" text-anchor="middle">交集 {b, c}：2 位；聯集：6 位</text><text x="380.0" y="288.5" font-size="18" fill="#edf4ff" text-anchor="middle">共同鄰居 = 2；Jaccard = 2/6 = 1/3</text></g></svg>