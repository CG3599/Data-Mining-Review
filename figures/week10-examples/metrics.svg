<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 335" role="img" aria-labelledby="title desc"><title id="title">96.5% 準確率，仍可能漏掉七成正類</title><desc id="desc">依同一混淆矩陣計算，條長採共同的 0–100% 尺度。Recall 30% 意味 300 位實際正類中只找出 90 位；四個指標的分母與用途不同。</desc><rect width="760" height="335" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">96.5% 準確率，仍可能漏掉七成正類</text><text x="30" y="115" font-size="19" fill="#edf4ff" text-anchor="start">Accuracy</text><rect x="160" y="90" width="490" height="34" rx="8" fill="#15263b" stroke="#456585"/><rect x="160" y="90" width="472.84999999999997" height="34" rx="8" fill="#8ac6ff" stroke="#8ac6ff"/><text x="670" y="115" font-size="18" fill="#edf4ff" text-anchor="start">96.5%</text><text x="30" y="175" font-size="19" fill="#edf4ff" text-anchor="start">Precision</text><rect x="160" y="150" width="490" height="34" rx="8" fill="#15263b" stroke="#456585"/><rect x="160" y="150" width="191.73913043478262" height="34" rx="8" fill="#ffd17c" stroke="#ffd17c"/><text x="670" y="175" font-size="18" fill="#edf4ff" text-anchor="start">39.1%</text><text x="30" y="235" font-size="19" fill="#edf4ff" text-anchor="start">Recall</text><rect x="160" y="210" width="490" height="34" rx="8" fill="#15263b" stroke="#456585"/><rect x="160" y="210" width="147.0" height="34" rx="8" fill="#ff9d9d" stroke="#ff9d9d"/><text x="670" y="235" font-size="18" fill="#edf4ff" text-anchor="start">30.0%</text><text x="30" y="295" font-size="19" fill="#edf4ff" text-anchor="start">F1</text><rect x="160" y="270" width="490" height="34" rx="8" fill="#15263b" stroke="#456585"/><rect x="160" y="270" width="166.41509433962264" height="34" rx="8" fill="#80dfbf" stroke="#80dfbf"/><text x="670" y="295" font-size="18" fill="#edf4ff" text-anchor="start">34.0%</text></g></svg>