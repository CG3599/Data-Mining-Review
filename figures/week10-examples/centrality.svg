<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">中間的人，不一定是朋友最多的人</title><desc id="desc">依教材鏈狀圖重繪。B、C、D 的 degree 都是 2，但中介中心性分別為 3、4、3；端點 A、E 不在其他節點對的最短路徑中。</desc><rect width="760" height="350" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">中間的人，不一定是朋友最多的人</text><path d="M110,155 L245,155" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M245,155 L380,155" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M380,155 L515,155" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M515,155 L650,155" fill="none" stroke="#8ac6ff" stroke-width="2"/><circle cx="110" cy="155" r="23" fill="#192d46" stroke="#8ac6ff" stroke-width="2"/><text x="110" y="161" font-size="18" fill="#edf4ff" text-anchor="middle">A</text><text x="110" y="220" font-size="18" fill="#ffd17c" text-anchor="middle">中介值 0</text><circle cx="245" cy="155" r="23" fill="#192d46" stroke="#8ac6ff" stroke-width="2"/><text x="245" y="161" font-size="18" fill="#edf4ff" text-anchor="middle">B</text><text x="245" y="220" font-size="18" fill="#ffd17c" text-anchor="middle">中介值 3</text><circle cx="380" cy="155" r="23" fill="#3b452b" stroke="#8ac6ff" stroke-width="2"/><text x="380" y="161" font-size="18" fill="#edf4ff" text-anchor="middle">C</text><text x="380" y="220" font-size="18" fill="#ffd17c" text-anchor="middle">中介值 4</text><circle cx="515" cy="155" r="23" fill="#192d46" stroke="#8ac6ff" stroke-width="2"/><text x="515" y="161" font-size="18" fill="#edf4ff" text-anchor="middle">D</text><text x="515" y="220" font-size="18" fill="#ffd17c" text-anchor="middle">中介值 3</text><circle cx="650" cy="155" r="23" fill="#192d46" stroke="#8ac6ff" stroke-width="2"/><text x="650" y="161" font-size="18" fill="#edf4ff" text-anchor="middle">E</text><text x="650" y="220" font-size="18" fill="#ffd17c" text-anchor="middle">中介值 0</text><text x="75" y="280" font-size="19" fill="#edf4ff" text-anchor="start">C 左側有 2 點，右側有 2 點：2 × 2 = 4 對最短路徑</text><text x="75" y="315" font-size="18" fill="#adc1da" text-anchor="start">採無向、不重複節點對；不把路徑端點算成中介。</text></g></svg>