<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">命中兩項之外，排序位置也影響分數</title><desc id="desc">依教材 Top-3 例題重繪。第二名 B 不相關，沒有收益；C 排第三名受到位置折扣。理想清單把三個相關項目都排在前三名。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">命中兩項之外，排序位置也影響分數</text><text x="30" y="85" font-size="20" fill="#ffd17c" text-anchor="start">相關集合：{A, C, F}</text><text x="30" y="130" font-size="18" fill="#edf4ff" text-anchor="start">實際推薦</text><rect x="180" y="100" width="155" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="257.5" y="126.0" font-size="18" fill="#edf4ff" text-anchor="middle">第 1 名</text><text x="257.5" y="151.0" font-size="18" fill="#edf4ff" text-anchor="middle">A ✓</text><rect x="360" y="100" width="155" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="437.5" y="126.0" font-size="18" fill="#edf4ff" text-anchor="middle">第 2 名</text><text x="437.5" y="151.0" font-size="18" fill="#edf4ff" text-anchor="middle">B ×</text><rect x="540" y="100" width="155" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="617.5" y="126.0" font-size="18" fill="#edf4ff" text-anchor="middle">第 3 名</text><text x="617.5" y="151.0" font-size="18" fill="#edf4ff" text-anchor="middle">C ✓</text><text x="30" y="220" font-size="18" fill="#edf4ff" text-anchor="start">折扣收益</text><text x="255" y="220" font-size="18" fill="#80dfbf" text-anchor="middle">1</text><text x="435" y="220" font-size="18" fill="#ff9d9d" text-anchor="middle">0</text><text x="615" y="220" font-size="18" fill="#80dfbf" text-anchor="middle">1 / log₂4 = 0.5</text><text x="30" y="280" font-size="19" fill="#edf4ff" text-anchor="start">DCG = 1.5；理想 A、C、F 的 IDCG ≈ 2.1309</text><text x="30" y="320" font-size="19" fill="#8ac6ff" text-anchor="start">NDCG ≈ 0.704；Precision@3 = Recall@3 = 2/3</text></g></svg>