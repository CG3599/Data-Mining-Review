<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">矩陣分解：用共享的 k 維空間配對</title><desc id="desc">尺寸圖為概念示意，方框寬高不按 m、n、k 比例。m 位使用者、n 個項目；兩側內部維度 k 必須相同，才能得到 m×n 的預測矩陣。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">矩陣分解：用共享的 k 維空間配對</text><rect x="25" y="120" width="210" height="140" rx="8" fill="#192d46" stroke="#456585"/><text x="130.0" y="183.5" font-size="18" fill="#edf4ff" text-anchor="middle">預測評分矩陣</text><text x="130.0" y="208.5" font-size="18" fill="#edf4ff" text-anchor="middle">R̂：m × n</text><text x="250" y="198" font-size="32" fill="#edf4ff" text-anchor="start">≈</text><rect x="300" y="120" width="150" height="140" rx="8" fill="#192d46" stroke="#456585"/><text x="375.0" y="183.5" font-size="18" fill="#edf4ff" text-anchor="middle">使用者因子</text><text x="375.0" y="208.5" font-size="18" fill="#edf4ff" text-anchor="middle">U：m × k</text><text x="467" y="198" font-size="30" fill="#edf4ff" text-anchor="start">×</text><rect x="515" y="120" width="220" height="140" rx="8" fill="#192d46" stroke="#456585"/><text x="625.0" y="183.5" font-size="18" fill="#edf4ff" text-anchor="middle">項目因子（轉置）</text><text x="625.0" y="208.5" font-size="18" fill="#edf4ff" text-anchor="middle">Vᵀ：k × n</text><text x="55" y="310" font-size="19" fill="#80dfbf" text-anchor="start">每格預測：使用者的 k 維向量 · 項目的 k 維向量</text></g></svg>