<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">三種特徵選擇：差別在選擇與訓練的關係</title><desc id="desc">Filter 先用統計指標篩選；Wrapper 依驗證表現反覆搜尋；Embedded 在訓練時一起完成。圖為流程整理，未表示某一方法永遠最好。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">三種特徵選擇：差別在選擇與訓練的關係</text><text x="30" y="115" font-size="18" fill="#ffd17c" text-anchor="start">Filter</text><rect x="170" y="80" width="285" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="312.5" y="118.5" font-size="18" fill="#edf4ff" text-anchor="middle">統計分數篩選</text><path d="M465,112 L505,112" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M498,107 L505,112 L498,117" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="515" y="80" width="215" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="622.5" y="118.5" font-size="18" fill="#edf4ff" text-anchor="middle">訓練分類器</text><text x="30" y="195" font-size="18" fill="#ffd17c" text-anchor="start">Wrapper</text><rect x="170" y="160" width="285" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="312.5" y="198.5" font-size="18" fill="#edf4ff" text-anchor="middle">特徵子集 ↔ 驗證表現</text><path d="M465,192 L505,192" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M498,187 L505,192 L498,197" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="515" y="160" width="215" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="622.5" y="198.5" font-size="18" fill="#edf4ff" text-anchor="middle">反覆訓練與搜尋</text><text x="30" y="275" font-size="18" fill="#ffd17c" text-anchor="start">Embedded</text><rect x="170" y="240" width="285" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="312.5" y="278.5" font-size="18" fill="#edf4ff" text-anchor="middle">模型訓練＋特徵選擇</text><path d="M465,272 L505,272" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M498,267 L505,272 L498,277" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="515" y="240" width="215" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="622.5" y="278.5" font-size="18" fill="#edf4ff" text-anchor="middle">同時得到模型與特徵</text></g></svg>