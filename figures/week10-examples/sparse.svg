<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc"><title id="title">省略零值，不重新編排特徵索引</title><desc id="desc">依教材六維例子重繪。行首 1 是類別標籤；非零值仍位於第 3、6 維。稀疏表示與完整向量具有相同語意。</desc><rect width="760" height="370" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text xml:space="preserve" x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">省略零值，不重新編排特徵索引</text><text xml:space="preserve" x="30" y="85" font-size="18" fill="#edf4ff" text-anchor="start">特徵索引</text><text xml:space="preserve" x="225" y="85" font-size="18" fill="#8ac6ff" text-anchor="middle">1</text><rect x="190" y="100" width="70" height="60" rx="8" fill="#192d46" stroke="#456585"/><text xml:space="preserve" x="225.0" y="136.0" font-size="18" fill="#edf4ff" text-anchor="middle">0</text><text xml:space="preserve" x="307" y="85" font-size="18" fill="#8ac6ff" text-anchor="middle">2</text><rect x="272" y="100" width="70" height="60" rx="8" fill="#192d46" stroke="#456585"/><text xml:space="preserve" x="307.0" y="136.0" font-size="18" fill="#edf4ff" text-anchor="middle">0</text><text xml:space="preserve" x="389" y="85" font-size="18" fill="#8ac6ff" text-anchor="middle">3</text><rect x="354" y="100" width="70" height="60" rx="8" fill="#3d3528" stroke="#456585"/><text xml:space="preserve" x="389.0" y="136.0" font-size="18" fill="#edf4ff" text-anchor="middle">1</text><text xml:space="preserve" x="471" y="85" font-size="18" fill="#8ac6ff" text-anchor="middle">4</text><rect x="436" y="100" width="70" height="60" rx="8" fill="#192d46" stroke="#456585"/><text xml:space="preserve" x="471.0" y="136.0" font-size="18" fill="#edf4ff" text-anchor="middle">0</text><text xml:space="preserve" x="553" y="85" font-size="18" fill="#8ac6ff" text-anchor="middle">5</text><rect x="518" y="100" width="70" height="60" rx="8" fill="#192d46" stroke="#456585"/><text xml:space="preserve" x="553.0" y="136.0" font-size="18" fill="#edf4ff" text-anchor="middle">0