<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" role="img" aria-labelledby="title desc"><title id="title">五折交叉驗證：每一折輪流驗證一次</title><desc id="desc">自編五折示例；教材另有十折圖。每輪必須重新訓練，縮放、補值、選特徵和重抽樣都只能使用當輪訓練折。</desc><rect width="760" height="345" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">五折交叉驗證：每一折輪流驗證一次</text><text x="30" y="78" font-size="18" fill="#ffd17c" text-anchor="start">先保留最終測試集；下方僅切分開發用的訓練資料</text><text x="30" y="121" font-size="17" fill="#edf4ff" text-anchor="start">第 1 輪</text><rect x="130" y="94" width="104" height="29" rx="8" fill="#594529" stroke="#456585"/><text x="182.0" y="114.5" font-size="18" fill="#edf4ff" text-anchor="middle">驗證</text><rect x="245" y="94" width="104" height="29" rx="8" fill="#173b36" stroke="#456585"/><text x="297.0" y="114.5" font-size="18" fill="#edf4ff" text-anchor="middle">訓練</text><rect x="360" y="94" width="104" height="29" rx="8" fill="#173b36" stroke="#456585"/><text x="412.0" y="114.5" font-size="18" fill="#edf4ff" text-anchor="middle">訓練</text><rect x="475" y="94" width="104" height="29" rx="8" fill="#173b36" stroke="#456585"/><text x="527.0" y="114.5" font-size="18" fill="#edf4ff" text-anchor="middle">訓練</text><rect x="590" y="94" width="104" height="29" rx="8" fill="#173b36" stroke="#456585"/><text x="642.0" y="114.5" font-size="18" fill="#edf4ff" text-anchor="middle">訓練</text><text x="30" y="157" font-size="17" fill="#edf4ff" text-anchor="start">第 2 輪</text><rect x="130" y="130" width="104" height="29" rx="8" fill="#173b36" stroke="#456585"/><text x="182.0" y="150.5" font-size="18" fill="#edf4ff" text-anchor="middle">訓練</text><rect x="245" y="130" width="104" height="29" rx="8" fill="#594529" stroke="#456585"/><text x="297.0" y="150.5" font-size="18" fill="#edf4ff" text-anchor="middle">驗證</text><rect x="360" y="130" width="104" height="29" rx="8" fill="#173b36" stroke="#456585"/><text x="412.0" y="150.5"