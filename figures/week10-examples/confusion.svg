<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-labelledby="title desc"><title id="title">同一組數字，四種預測結果</title><desc id="desc">依教材例題重繪。Recall=90/300=30%；Precision=90/230≈39.13%。高 Accuracy 96.5% 主要受到大量真負類影響，不能代表正類找得好。</desc><rect width="760" height="365" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">同一組數字，四種預測結果</text><text x="300" y="85" font-size="19" fill="#8ac6ff" text-anchor="middle">預測有癌症</text><text x="545" y="85" font-size="19" fill="#8ac6ff" text-anchor="middle">預測無癌症</text><text x="30" y="150" font-size="18" fill="#edf4ff" text-anchor="start">實際有癌症</text><text x="30" y="245" font-size="18" fill="#edf4ff" text-anchor="start">實際無癌症</text><rect x="185" y="105" width="220" height="85" rx="8" fill="#123c39" stroke="#456585"/><text x="295.0" y="141.0" font-size="18" fill="#edf4ff" text-anchor="middle">TP = 90</text><text x="295.0" y="166.0" font-size="18" fill="#edf4ff" text-anchor="middle">正確找出</text><rect x="425" y="105" width="220" height="85" rx="8" fill="#472b38" stroke="#456585"/><text x="535.0" y="141.0" font-size="18" fill="#edf4ff" text-anchor="middle">FN = 210</text><text x="535.0" y="166.0" font-size="18" fill="#edf4ff" text-anchor="middle">漏診</text><rect x="185" y="205" width="220" height="85" rx="8" fill="#493b28" stroke="#456585"/><text x="295.0" y="241.0" font-size="18" fill="#edf4ff" text-anchor="middle">FP = 140</text><text x="295.0" y="266.0" font-size="18" fill="#edf4ff" text-anchor="middle">誤報</text><rect x="425" y="205" width="220" height="85" rx="8" fill="#123c39" stroke="#456585"/><text x="535.0" y="241.0" font-size="18" fill="#edf4ff" text-anchor="middle">TN = 9560</text><text x="535.0" y="266.0" font-size="18" fill="#edf4ff" text-anchor="middle">正確排除</text><text x="190" y="330" font-size="18" fill="#edf4ff" text-anchor="start">實際正類 300 人；預測正類 230 人；共 10,000 人</text></g></svg>