<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">4 分不一定比 3 分更喜歡</title><desc id="desc">依教材評分尺度例重繪。A 給 4 分比自己平均低 0.5；B 給 3 分卻比自己平均高 1。平均校正比較相對偏好，再加回目標使用者的平均。</desc><rect width="760" height="330" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">4 分不一定比 3 分更喜歡</text><text x="30" y="125" font-size="20" fill="#edf4ff" text-anchor="start">使用者 A</text><rect x="180" y="95" width="150" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="255.0" y="121.0" font-size="18" fill="#edf4ff" text-anchor="middle">平均 4.5</text><text x="255.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">本次 4</text><path d="M345,128 L425,128" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M418,123 L425,128 L418,133" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="440" y="95" width="265" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="572.5" y="121.0" font-size="18" fill="#edf4ff" text-anchor="middle">相對偏差 -0.5</text><text x="572.5" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">低於常態</text><text x="30" y="245" font-size="20" fill="#edf4ff" text-anchor="start">使用者 B</text><rect x="180" y="215" width="150" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="255.0" y="241.0" font-size="18" fill="#edf4ff" text-anchor="middle">平均 2</text><text x="255.0" y="266.0" font-size="18" fill="#edf4ff" text-anchor="middle">本次 3</text><path d="M345,248 L425,248" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M418,243 L425,248 L418,253" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="440" y="215" width="265" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="572.5" y="241.0" font-size="18" fill="#edf4ff" text-anchor="middle">相對偏差 +1</text><text x="572.5" y="266.0" font-size="18" fill="#edf4ff" text-anchor="middle">高於常態</text></g></svg>