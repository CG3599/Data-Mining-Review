<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>Bootstrap 抽樣允許重複</title><desc>每欄由上往下讀。兩次都從 A、B、C、D 有放回地抽四筆，第一組漏掉 B，第二組漏掉 A；各訓練一個模型後再投票。</desc><rect x="14" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="95" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">原始資料</text><rect x="186" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="267" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">樣本一</text><rect x="358" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="439" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">樣本二</text><rect x="14" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">A、B</text><rect x="186" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">A、A</text><rect x="358" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">D、B</text><rect x="14" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">C、D</text><rect x="186" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">C、D</text><rect x="358" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">B、C</text></svg>
