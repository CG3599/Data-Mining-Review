<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">很多分支可能帶來很高的資訊增益</title><desc id="desc">自編六筆 ID 切分。父節點熵 1 bit，分割後熵 0，Gain=1；SplitInfo=log₂6≈2.585，GainRatio≈0.387。Gain Ratio 對分支分布作校正，但不保證任意資料都不會選 ID。</desc><rect width="760" height="350" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">很多分支可能帶來很高的資訊增益</text><rect x="255" y="75" width="250" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="108.5" font-size="18" fill="#edf4ff" text-anchor="middle">6 筆資料，每個 ID 都不同</text><path d="M380,130 L75,200" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="30" y="200" width="90" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="75.0" y="221.0" font-size="18" fill="#edf4ff" text-anchor="middle">ID 1</text><text x="75.0" y="246.0" font-size="18" fill="#edf4ff" text-anchor="middle">Y</text><path d="M380,130 L197,200" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="152" y="200" width="90" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="197.0" y="221.0" font-size="18" fill="#edf4ff" text-anchor="middle">ID 2</text><text x="197.0" y="246.0" font-size="18" fill="#edf4ff" text-anchor="middle">N</text><path d="M380,130 L319,200" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="274" y="200" width="90" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="319.0" y="221.0" font-size="18" fill="#edf4ff" text-anchor="middle">ID 3</text><text x="319.0" y="246.0" font-size="18" fill="#edf4ff" text-anchor="middle">Y</text><path d="M380,130 L441,200" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="396" y="200" width="90" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="441.0" y="221.0" font-size="18" fill="#edf4ff" text-anchor="middle">ID 4</text><text x="441.0" y="246.0" font-size="18" fill="#edf4ff" text-anchor="middle">N</text><path d="M380,130 L563,200" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="518" y="200" width="90" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="563.0" y="221.0" font-size="18" fill="#edf4ff" text-anchor="middle">ID 5</text><text x="563.0" y="246.0" font-size="18" fill="#edf4ff" text-anchor="middle">Y</text><path d="M380,130 L685,200" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="640" y="200" width="90" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="685.0" y="221.0" font-size="18" fill="#edf4ff" text-anchor="middle">ID 6</text><text x="685.0" y="246.0" font-size="18" fill="#edf4ff" text-anchor="middle">N</text><text x="35" y="305" font-size="18" fill="#ffd17c" text-anchor="start">每葉只剩 1 筆 → 子節點熵全為 0；但可能只記住身分。</text></g></svg>