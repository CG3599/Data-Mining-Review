<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" role="img" aria-labelledby="title desc"><title id="title">資訊增益：子節點熵要乘上各組比例</title><desc id="desc">依教材的 14 筆資料計算。Middle 是純節點、熵為 0；另兩組各占 5/14。三個熵不能直接除以 3，因為子節點大小不同。</desc><rect width="760" height="355" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">資訊增益：子節點熵要乘上各組比例</text><rect x="255" y="70" width="250" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="96.0" font-size="18" fill="#edf4ff" text-anchor="middle">父節點 9 YES / 5 NO</text><text x="380.0" y="121.0" font-size="18" fill="#edf4ff" text-anchor="middle">Entropy ≈ 0.940</text><path d="M380,135 L130,185" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="15" y="185" width="230" height="70" rx="8" fill="#192d46" stroke="#456585"/><text x="130.0" y="213.5" font-size="18" fill="#edf4ff" text-anchor="middle">Youth：2 YES / 3 NO</text><text x="130.0" y="238.5" font-size="18" fill="#edf4ff" text-anchor="middle">5/14 × 0.971</text><path d="M380,135 L380,185" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="265" y="185" width="230" height="70" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="213.5" font-size="18" fill="#edf4ff" text-anchor="middle">Middle：4 YES / 0 NO</text><text x="380.0" y="238.5" font-size="18" fill="#edf4ff" text-anchor="middle">4/14 × 0</text><path d="M380,135 L630,185" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="515" y="185" width="230" height="70" rx="8" fill="#192d46" stroke="#456585"/><text x="630.0" y="213.5" font-size="18" fill="#edf4ff" text-anchor="middle">Senior：3 YES / 2 NO</text><text x="630.0" y="238.5" font-size="18" fill="#edf4ff" text-anchor="middle">5/14 × 0.971</text><text x="35" y="315" font-size="18" fill="#80dfbf" text-anchor="start">加權子節點熵 ≈ 0.694；Gain(age) ≈ 0.940 − 0.694 = 0.246 bit</text></g></svg>