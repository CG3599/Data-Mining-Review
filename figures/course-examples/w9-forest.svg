<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="title desc"><title id="title">隨機森林的兩種隨機性</title><desc id="desc">自編三棵樹流程。不同訓練抽樣降低資料重複性，節點隨機特徵子集降低樹之間相似性；圖中列出的特徵只是某個節點候選，不是整棵樹永遠只能用那些特徵。</desc><rect width="760" height="375" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">隨機森林的兩種隨機性</text><rect x="25" y="80" width="710" height="50" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="111.0" font-size="18" fill="#edf4ff" text-anchor="middle">原始訓練集與完整特徵池</text><path d="M380,130 L135,165" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="25" y="165" width="220" height="110" rx="8" fill="#192d46" stroke="#456585"/><text x="135.0" y="201.0" font-size="18" fill="#edf4ff" text-anchor="middle">樹 1</text><text x="135.0" y="226.0" font-size="18" fill="#edf4ff" text-anchor="middle">各自 Bootstrap 抽樣</text><text x="135.0" y="251.0" font-size="18" fill="#edf4ff" text-anchor="middle">候選：年齡、收入</text><path d="M380,130 L380,165" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="270" y="165" width="220" height="110" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="201.0" font-size="18" fill="#edf4ff" text-anchor="middle">樹 2</text><text x="380.0" y="226.0" font-size="18" fill="#edf4ff" text-anchor="middle">各自 Bootstrap 抽樣</text><text x="380.0" y="251.0" font-size="18" fill="#edf4ff" text-anchor="middle">候選：收入、職業</text><path d="M380,130 L625,165" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="515" y="165" width="220" height="110" rx="8" fill="#192d46" stroke="#456585"/><text x="625.0" y="201.0" font-size="18" fill="#edf4ff" text-anchor="middle">樹 3</text><text x="625.0" y="226.0" font-size="18" fill="#edf4ff" text-anchor="middle">各自 Bootstrap 抽樣</text><text x="625.0" y="251.0" font-size="18" fill="#edf4ff" text-anchor="middle">候選：年齡、信用</text><text x="35" y="330" font-size="18" fill="#80dfbf" text-anchor="start">每個節點重新抽候選特徵，再從候選中挑最佳分割；最後投票。</text></g></svg>