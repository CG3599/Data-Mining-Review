<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Negative border：緊貼頻繁區域外側的項目集</title><desc id="desc">依現有講義筆記集合重繪：負邊界為 B、AC、AD；單項 B 的真子集只有空集合。若完整資料驗證時有邊界項目變頻繁，表示抽樣可能漏掉模式。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">Negative border：緊貼頻繁區域外側的項目集</text><rect x="35" y="90" width="690" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="128.5" font-size="18" fill="#edf4ff" text-anchor="middle">抽樣中的頻繁集合：A、C、D、CD</text><rect x="35" y="190" width="205" height="70" rx="8" fill="#192d46" stroke="#456585"/><text x="137.5" y="218.5" font-size="18" fill="#edf4ff" text-anchor="middle">B</text><text x="137.5" y="243.5" font-size="18" fill="#edf4ff" text-anchor="middle">自身不頻繁</text><rect x="275" y="190" width="205" height="70" rx="8" fill="#192d46" stroke="#456585"/><text x="377.5" y="218.5" font-size="18" fill="#edf4ff" text-anchor="middle">AC</text><text x="377.5" y="243.5" font-size="18" fill="#edf4ff" text-anchor="middle">A、C 皆頻繁</text><rect x="520" y="190" width="205" height="70" rx="8" fill="#192d46" stroke="#456585"/><text x="622.5" y="218.5" font-size="18" fill="#edf4ff" text-anchor="middle">AD</text><text x="622.5" y="243.5" font-size="18" fill="#edf4ff" text-anchor="middle">A、D 皆頻繁</text><text x="35" y="320" font-size="20" fill="#ffd17c" text-anchor="start">邊界項目自身不頻繁，但所有真子集都頻繁。</text></g></svg>