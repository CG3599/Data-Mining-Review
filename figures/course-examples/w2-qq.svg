<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Q-Q 圖比較分位數，不是個別樣本配對</title><desc id="desc">自編三種形狀。接近 y=x 表示兩分布較接近；其他直線可反映位置或尺度不同；系統性彎曲表示形狀差異。圖形是示意，不是統計檢定結論。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">Q-Q 圖比較分位數，不是個別樣本配對</text><text x="130" y="85" font-size="17" fill="#8ac6ff" text-anchor="middle">接近 y = x</text><path d="M50,260 L230,260" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M50,260 L50,100" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M50,260 L210,100" fill="none" stroke="#adc1da" stroke-width="1" stroke-dasharray="6 5"/><circle cx="50" cy="260" r="5" fill="#ffd17c"/><circle cx="90" cy="220" r="5" fill="#ffd17c"/><circle cx="130" cy="180" r="5" fill="#ffd17c"/><circle cx="170" cy="140" r="5" fill="#ffd17c"/><circle cx="210" cy="100" r="5" fill="#ffd17c"/><text x="380" y="85" font-size="17" fill="#8ac6ff" text-anchor="middle">線性位移／縮放</text><path d="M300,260 L480,260" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M300,260 L300,100" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M300,260 L460,100" fill="none" stroke="#adc1da" stroke-width="1" stroke-dasharray="6 5"/><circle cx="300" cy="240.0" r="5" fill="#ffd17c"/><circle cx="340" cy="210.0" r="5" fill="#ffd17c"/><circle cx="380" cy="180" r="5" fill="#ffd17c"/><circle cx="420" cy="150.0" r="5" fill="#ffd17c"/><circle cx="460" cy="120.0" r="5" fill="#ffd17c"/><text x="630" y="85" font-size="17" fill="#8ac6ff" text-anchor="middle">彎曲：形狀有差異</text><path d="M550,260 L730,260" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M550,260 L550,100" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M550,260 L710,100" fill="none" stroke="#adc1da" stroke-width="1" stroke-dasharray="6 5"/><circle cx="550" cy="260" r="5" fill="#ffd17c"/><circle cx="590" cy="248.0" r="5" fill="#ffd17c"/><circle cx="630" cy="220" r="5" fill="#ffd17c"/><circle cx="670" cy="168.0" r="5" fill="#ffd17c"/><circle cx="710" cy="100" r="5" fill="#ffd17c"/><text x="45" y="325" font-size="18" fill="#edf4ff" text-anchor="start">橫軸：分布 A 的分位數；縱軸：分布 B 的對應分位數。</text></g></svg>