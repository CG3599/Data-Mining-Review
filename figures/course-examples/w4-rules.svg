<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">一個三項集，拆出六條候選規則</title><desc id="desc">自編以 A、B、C 替代項目名稱。前後件互斥，聯集都為 ABC，所以六條規則的支持度相同；前件支持度不同，信賴度可能不同。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">一個三項集，拆出六條候選規則</text><text x="30" y="85" font-size="19" fill="#ffd17c" text-anchor="start">頻繁項目集 {A,B,C}：選非空真子集作前件</text><rect x="35" y="115" width="220" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="145.0" y="153.5" font-size="18" fill="#edf4ff" text-anchor="middle">A → BC</text><rect x="280" y="115" width="220" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="390.0" y="153.5" font-size="18" fill="#edf4ff" text-anchor="middle">B → AC</text><rect x="525" y="115" width="220" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="635.0" y="153.5" font-size="18" fill="#edf4ff" text-anchor="middle">C → AB</text><rect x="35" y="200" width="220" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="145.0" y="238.5" font-size="18" fill="#edf4ff" text-anchor="middle">AB → C</text><rect x="280" y="200" width="220" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="390.0" y="238.5" font-size="18" fill="#edf4ff" text-anchor="middle">AC → B</text><rect x="525" y="200" width="220" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="635.0" y="238.5" font-size="18" fill="#edf4ff" text-anchor="middle">BC → A</text><text x="35" y="325" font-size="20" fill="#80dfbf" text-anchor="start">2³ − 2 = 6 條候選規則；仍須逐條檢查信賴度。</text></g></svg>