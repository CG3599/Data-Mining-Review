<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">TF-IDF：常出現，也要有辨識力</title><desc id="desc">自編概念圖。TF 衡量詞在文件中的頻率，IDF 降低普遍詞的權重；兩者的具體正規化與平滑版本可能不同，本圖不指定某一版本。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">TF-IDF：常出現，也要有辨識力</text><rect x="30" y="95" width="300" height="105" rx="8" fill="#192d46" stroke="#456585"/><text x="180.0" y="141.0" font-size="18" fill="#edf4ff" text-anchor="middle">某詞在這篇文章常出現</text><text x="180.0" y="166.0" font-size="18" fill="#edf4ff" text-anchor="middle">TF 較高</text><rect x="430" y="95" width="300" height="105" rx="8" fill="#192d46" stroke="#456585"/><text x="580.0" y="141.0" font-size="18" fill="#edf4ff" text-anchor="middle">某詞在所有文章都常見</text><text x="580.0" y="166.0" font-size="18" fill="#edf4ff" text-anchor="middle">IDF 較低</text><text x="350" y="155" font-size="35" fill="#ffd17c" text-anchor="start">×</text><rect x="70" y="245" width="620" height="70" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="273.5" font-size="18" fill="#edf4ff" text-anchor="middle">TF-IDF：兼顧文章內頻率與跨文件辨識力</text><text x="380.0" y="298.5" font-size="18" fill="#edf4ff" text-anchor="middle">不是出現次數最多的詞就一定最具代表性</text></g></svg>