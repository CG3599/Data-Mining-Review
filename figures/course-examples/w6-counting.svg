<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">兩種支持計數方法，應得到同一個答案</title><desc id="desc">自編三筆交易。候選導向逐候選檢查交易，交易導向逐交易列出所含候選；實際效率也取決於候選索引與資料結構，不由示意箭頭決定。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">兩種支持計數方法，應得到同一個答案</text><text x="35" y="80" font-size="18" fill="#ffd17c" text-anchor="start">交易：T1=ABC，T2=AC，T3=BC；候選：AB、AC、BC</text><text x="25" y="130" font-size="20" fill="#8ac6ff" text-anchor="start">以候選為中心</text><text x="25" y="175" font-size="17" fill="#edf4ff" text-anchor="start">AB → 檢查 T1、T2、T3</text><text x="25" y="218" font-size="17" fill="#edf4ff" text-anchor="start">AC → 檢查 T1、T2、T3</text><text x="25" y="261" font-size="17" fill="#edf4ff" text-anchor="start">BC → 檢查 T1、T2、T3</text><text x="405" y="130" font-size="20" fill="#8ac6ff" text-anchor="start">以交易為中心</text><text x="405" y="175" font-size="17" fill="#edf4ff" text-anchor="start">T1 → 找出 AB、AC、BC</text><text x="405" y="218" font-size="17" fill="#edf4ff" text-anchor="start">T2 → 找出 AC</text><text x="405" y="261" font-size="17" fill="#edf4ff" text-anchor="start">T3 → 找出 BC</text><text x="35" y="325" font-size="18" fill="#80dfbf" text-anchor="start">最後計數相同：AB=1、AC=2、BC=2；差別在遍歷方向。</text></g></svg>