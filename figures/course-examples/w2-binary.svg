<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc"><title id="title">非對稱二元資料：共同缺席可能不重要</title><desc id="desc">自編二元特徵例。只有 a 共同出現，a、b 至少在一方出現；Jaccard 為 1/2。這是忽略共同零值的一種相似度示範，是否適用仍取決於任務。</desc><rect width="760" height="370" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">非對稱二元資料：共同缺席可能不重要</text><text x="30" y="85" font-size="19" fill="#ffd17c" text-anchor="start">用 1 表示具有某項特徵；0 表示沒有</text><rect x="25" y="110" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="80.0" y="137.0" font-size="18" fill="#edf4ff" text-anchor="middle">特徵</text><rect x="145" y="110" width="110" height="42" rx="8" fill="#244b60" stroke="#456585"/><text x="200.0" y="137.0" font-size="18" fill="#edf4ff" text-anchor="middle">a</text><rect x="265" y="110" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="320.0" y="137.0" font-size="18" fill="#edf4ff" text-anchor="middle">b</text><rect x="385" y="110" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="440.0" y="137.0" font-size="18" fill="#edf4ff" text-anchor="middle">c</text><rect x="505" y="110" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="560.0" y="137.0" font-size="18" fill="#edf4ff" text-anchor="middle">d</text><rect x="625" y="110" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="680.0" y="137.0" font-size="18" fill="#edf4ff" text-anchor="middle">e</text><rect x="25" y="160" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="80.0" y="187.0" font-size="18" fill="#edf4ff" text-anchor="middle">物件 X</text><rect x="145" y="160" width="110" height="42" rx="8" fill="#244b60" stroke="#456585"/><text x="200.0" y="187.0" font-size="18" fill="#edf4ff" text-anchor="middle">1</text><rect x="265" y="160" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="320.0" y="187.0" font-size="18" fill="#edf4ff" text-anchor="middle">1</text><rect x="385" y="160" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="440.0" y="187.0" font-size="18" fill="#edf4ff" text-anchor="middle">0</text><rect x="505" y="160" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="560.0" y="187.0" font-size="18" fill="#edf4ff" text-anchor="middle">0</text><rect x="625" y="160" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="680.0" y="187.0" font-size="18" fill="#edf4ff" text-anchor="middle">0</text><rect x="25" y="210" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="80.0" y="237.0" font-size="18" fill="#edf4ff" text-anchor="middle">物件 Y</text><rect x="145" y="210" width="110" height="42" rx="8" fill="#244b60" stroke="#456585"/><text x="200.0" y="237.0" font-size="18" fill="#edf4ff" text-anchor="middle">1</text><rect x="265" y="210" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="320.0" y="237.0" font-size="18" fill="#edf4ff" text-anchor="middle">0</text><rect x="385" y="210" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="440.0" y="237.0" font-size="18" fill="#edf4ff" text-anchor="middle">0</text><rect x="505" y="210" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="560.0" y="237.0" font-size="18" fill="#edf4ff" text-anchor="middle">0</text><rect x="625" y="210" width="110" height="42" rx="8" fill="#192d46" stroke="#456585"/><text x="680.0" y="237.0" font-size="18" fill="#edf4ff" text-anchor="middle">0</text><text x="30" y="295" font-size="18" fill="#edf4ff" text-anchor="start">同為 0 的 c、d、e：若「共同缺席」不重要，就不應加分。</text><text x="30" y="330" font-size="18" fill="#80dfbf" text-anchor="start">補充：只比較出現的特徵，Jaccard = 1 / 2。</text></g></svg>