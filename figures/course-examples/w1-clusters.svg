<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">分群：從相似性找出資料的群體</title><desc id="desc">自編兩群示意，圓與方塊用來區分結果。分群依所選特徵與相似度而變；圖中兩團清楚分開只是容易理解的例子，不代表所有資料都有明確群界。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">分群：從相似性找出資料的群體</text><path d="M65,285 L690,285" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M65,285 L65,90" fill="none" stroke="#8ac6ff" stroke-width="2"/><circle cx="140" cy="210" r="9" fill="#1d5c55" stroke="#8ac6ff" stroke-width="2"/><text x="140" y="216" font-size="18" fill="#edf4ff" text-anchor="middle"></text><circle cx="160" cy="180" r="9" fill="#1d5c55" stroke="#8ac6ff" stroke-width="2"/><text x="160" y="186" font-size="18" fill="#edf4ff" text-anchor="middle"></text><circle cx="190" cy="220" r="9" fill="#1d5c55" stroke="#8ac6ff" stroke-width="2"/><text x="190" y="226" font-size="18" fill="#edf4ff" text-anchor="middle"></text><circle cx="200" cy="170" r="9" fill="#1d5c55" stroke="#8ac6ff" stroke-width="2"/><text x="200" y="176" font-size="18" fill="#edf4ff" text-anchor="middle"></text><circle cx="230" cy="200" r="9" fill="#1d5c55" stroke="#8ac6ff" stroke-width="2"/><text x="230" y="206" font-size="18" fill="#edf4ff" text-anchor="middle"></text><rect x="450" y="140" width="16" height="16" fill="#ffd17c"/><rect x="475" y="110" width="16" height="16" fill="#ffd17c"/><rect x="510" y="155" width="16" height="16" fill="#ffd17c"/><rect x="535" y="120" width="16" height="16" fill="#ffd17c"/><rect x="555" y="160" width="16" height="16" fill="#ffd17c"/><text x="125" y="325" font-size="19" fill="#80dfbf" text-anchor="start">群內較相似</text><text x="445" y="325" font-size="19" fill="#ffd17c" text-anchor="start">群間較不同</text><text x="75" y="76" font-size="17" fill="#edf4ff" text-anchor="start">示意特徵空間；顏色是分群結果，不是預先給定標籤。</text></g></svg>