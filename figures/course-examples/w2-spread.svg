<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="title desc"><title id="title">同樣平均，分散程度仍可能相差很大</title><desc id="desc">自編兩組資料，使用母體分母 N=3。A 的平方偏差和為 2，B 為 32；若視為樣本，改用 n−1=2，樣本變異數分別為 1、16。</desc><rect width="760" height="375" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">同樣平均，分散程度仍可能相差很大</text><text x="35" y="85" font-size="19" fill="#ffd17c" text-anchor="start">兩組平均數都等於 5，但偏離程度不同</text><text x="25" y="150" font-size="19" fill="#80dfbf" text-anchor="start">A：4、5、6</text><path d="M220,145 L700,145" fill="none" stroke="#8ac6ff" stroke-width="2"/><circle cx="412" cy="145" r="9" fill="#80dfbf"/><circle cx="460" cy="145" r="9" fill="#80dfbf"/><circle cx="508" cy="145" r="9" fill="#80dfbf"/><text x="268" y="175" font-size="16" fill="#edf4ff" text-anchor="middle">1</text><text x="460" y="175" font-size="16" fill="#edf4ff" text-anchor="middle">5</text><text x="652" y="175" font-size="16" fill="#edf4ff" text-anchor="middle">9</text><text x="25" y="250" font-size="19" fill="#8ac6ff" text-anchor="start">B：1、5、9</text><path d="M220,245 L700,245" fill="none" stroke="#8ac6ff" stroke-width="2"/><circle cx="268" cy="245" r="9" fill="#8ac6ff"/><circle cx="460" cy="245" r="9" fill="#8ac6ff"/><circle cx="652" cy="245" r="9" fill="#8ac6ff"/><text x="268" y="275" font-size="16" fill="#edf4ff" text-anchor="middle">1</text><text x="460" y="275" font-size="16" fill="#edf4ff" text-anchor="middle">5</text><text x="652" y="275" font-size="16" fill="#edf4ff" text-anchor="middle">9</text><text x="30" y="330" font-size="18" fill="#edf4ff" text-anchor="start">母體變異數：A = 2/3；B = 32/3。標準差為變異數平方根。</text></g></svg>