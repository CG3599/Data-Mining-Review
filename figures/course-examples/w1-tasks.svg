<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">先釐清要描述資料，還是預測結果</title><desc id="desc">自編任務對照。描述式可找共現、群體或分布；預測式使用已知資料推測未知結果。差別在任務目標，不是資料檔案格式。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">先釐清要描述資料，還是預測結果</text><rect x="30" y="100" width="315" height="140" rx="8" fill="#192d46" stroke="#456585"/><text x="187.5" y="151.0" font-size="18" fill="#edf4ff" text-anchor="middle">描述式</text><text x="187.5" y="176.0" font-size="18" fill="#edf4ff" text-anchor="middle">這批資料有什麼結構？</text><text x="187.5" y="201.0" font-size="18" fill="#edf4ff" text-anchor="middle">例如：常一起購買的商品</text><rect x="415" y="100" width="315" height="140" rx="8" fill="#192d46" stroke="#456585"/><text x="572.5" y="151.0" font-size="18" fill="#edf4ff" text-anchor="middle">預測式</text><text x="572.5" y="176.0" font-size="18" fill="#edf4ff" text-anchor="middle">新資料的結果可能是什麼？</text><text x="572.5" y="201.0" font-size="18" fill="#edf4ff" text-anchor="middle">例如：是否會購買商品</text><text x="50" y="300" font-size="19" fill="#80dfbf" text-anchor="start">同一批交易資料，可依不同問題採用不同的探勘任務。</text></g></svg>