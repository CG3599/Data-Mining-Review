<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">逐層搜尋：候選集合與頻繁集合不要混淆</title><desc id="desc">自編 Apriori 流程。從 Lk 連接並剪枝得到候選，再掃描交易計數得到 Lk+1；若下一層沒有可保留項目集，搜尋便停止。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">逐層搜尋：候選集合與頻繁集合不要混淆</text><rect x="25" y="95" width="132" height="62" rx="8" fill="#192d46" stroke="#456585"/><text x="91.0" y="132.0" font-size="18" fill="#edf4ff" text-anchor="middle">L₁</text><rect x="173" y="95" width="132" height="62" rx="8" fill="#192d46" stroke="#456585"/><text x="239.0" y="132.0" font-size="18" fill="#edf4ff" text-anchor="middle">產生並剪枝</text><rect x="321" y="95" width="132" height="62" rx="8" fill="#192d46" stroke="#456585"/><text x="387.0" y="132.0" font-size="18" fill="#edf4ff" text-anchor="middle">C₂</text><rect x="469" y="95" width="132" height="62" rx="8" fill="#192d46" stroke="#456585"/><text x="535.0" y="132.0" font-size="18" fill="#edf4ff" text-anchor="middle">掃描計數</text><rect x="617" y="95" width="132" height="62" rx="8" fill="#192d46" stroke="#456585"/><text x="683.0" y="132.0" font-size="18" fill="#edf4ff" text-anchor="middle">L₂</text><path d="M158,126 L170,126" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M163,121 L170,126 L163,131" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M306,126 L318,126" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M311,121 L318,126 L311,131" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M454,126 L466,126" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M459,121 L466,126 L459,131" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M602,126 L614,126" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M607,121 L614,126 L607,131" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="25" y="205" width="132" height="62" rx="8" fill="#192