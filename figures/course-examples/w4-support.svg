<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">支持計數：逐筆檢查是否完整包含項目集</title><desc id="desc">自編四筆交易，三筆包含 B 與 C。每筆交易只計一次；分母是全部四筆交易，而不是出現 B 或 C 的商品個數。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">支持計數：逐筆檢查是否完整包含項目集</text><rect x="35" y="85" width="110" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="90.0" y="111.0" font-size="18" fill="#edf4ff" text-anchor="middle">T1</text><rect x="160" y="85" width="280" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="300.0" y="111.0" font-size="18" fill="#edf4ff" text-anchor="middle">A B C</text><text x="480" y="112" font-size="20" fill="#80dfbf" text-anchor="start">包含 {B,C} ✓</text><rect x="35" y="134" width="110" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="90.0" y="160.0" font-size="18" fill="#edf4ff" text-anchor="middle">T2</text><rect x="160" y="134" width="280" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="300.0" y="160.0" font-size="18" fill="#edf4ff" text-anchor="middle">B C</text><text x="480" y="161" font-size="20" fill="#80dfbf" text-anchor="start">包含 {B,C} ✓</text><rect x="35" y="183" width="110" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="90.0" y="209.0" font-size="18" fill="#edf4ff" text-anchor="middle">T3</text><rect x="160" y="183" width="280" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="300.0" y="209.0" font-size="18" fill="#edf4ff" text-anchor="middle">A C</text><text x="480" y="210" font-size="20" fill="#adc1da" text-anchor="start">不包含 {B,C}</text><rect x="35" y="232" width="110" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="90.0" y="258.0" font-size="18" fill="#edf4ff" text-anchor="middle">T4</text><rect x="160" y="232" width="280" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="300.0" y="258.0" font-size="18" fill="#edf4ff" text-anchor="middle">A B C</text><text x="480" y="259" font-size="20" fill="#80dfbf" text-anchor="start">包含 {B,C} ✓</text><text x="45" y="320" font-size="21" fill="#8ac6ff" text-anchor="start">Count({B,C}) = 3；Support({B,C}) = 3/4 = 75%</text></g></svg>