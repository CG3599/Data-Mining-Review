<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">三種學習設定：差別在已知標籤</title><desc id="desc">自編資料標籤示意，? 表示未標記。半監督式同時利用有標籤與未標籤資料；未標記不等於負類，也不代表資料沒有其他特徵。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">三種學習設定：差別在已知標籤</text><text x="125" y="90" font-size="21" fill="#8ac6ff" text-anchor="middle">監督式</text><rect x="40" y="120" width="80" height="40" rx="8" fill="#244b60" stroke="#456585"/><text x="80.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">A</text><rect x="132" y="120" width="80" height="40" rx="8" fill="#244b60" stroke="#456585"/><text x="172.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">B</text><rect x="40" y="168" width="80" height="40" rx="8" fill="#244b60" stroke="#456585"/><text x="80.0" y="194.0" font-size="18" fill="#edf4ff" text-anchor="middle">A</text><rect x="132" y="168" width="80" height="40" rx="8" fill="#244b60" stroke="#456585"/><text x="172.0" y="194.0" font-size="18" fill="#edf4ff" text-anchor="middle">B</text><rect x="40" y="216" width="80" height="40" rx="8" fill="#244b60" stroke="#456585"/><text x="80.0" y="242.0" font-size="18" fill="#edf4ff" text-anchor="middle">A</text><rect x="132" y="216" width="80" height="40" rx="8" fill="#244b60" stroke="#456585"/><text x="172.0" y="242.0" font-size="18" fill="#edf4ff" text-anchor="middle">B</text><text x="130" y="310" font-size="17" fill="#edf4ff" text-anchor="middle">皆有標籤</text><text x="375" y="90" font-size="21" fill="#8ac6ff" text-anchor="middle">非監督式</text><rect x="290" y="120" width="80" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="330.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">?</text><rect x="382" y="120" width="80" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="422.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">?</text><rect x="290" y="168" width="80" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="330.0" y="194.0" font-size="18" fill="#edf4ff" text-anchor="middle">?</text><rect x="382" y="168" width="80" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="422.0" y="194.0" font-size="18" fill="#edf4ff" text-anchor="middle">?</text><rect x="290" y="216" width="80" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="330.0" y="242.0" font-size="18" fill="#edf4ff" text-anchor="middle">?</text><rect x="382" y="216" width="80" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="422.0" y="242.0" font-size="18" fill="#edf4ff" text-anchor="middle">?</text><text x="380" y="310" font-size="17" fill="#edf4ff" text-anchor="middle">皆無標籤</text><text x="625" y="90" font-size="21" fill="#8ac6ff" text-anchor="middle">半監督式</text><rect x="540" y="120" width="80" height="40" rx="8" fill="#244b60" stroke="#456585"/><text x="580.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">A</text><rect x="632" y="120" width="80" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="672.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">?</text><rect x="540" y="168" width="80" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="580.0" y="194.0" font-size="18" fill="#edf4ff" text-anchor="middle">?</text><rect x="632" y="168" width="80" height="40" rx="8" fill="#244b60" stroke="#456585"/><text x="672.0" y="194.0" font-size="18" fill="#edf4ff" text-anchor="middle">B</text><rect x="540" y="216" width="80" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="580.0" y="242.0" font-size="18" fill="#edf4ff" text-anchor="middle">?</text><rect x="632" y="216" width="80" height="40" rx="8" fill="#192d46" stroke="#456585"/><text x="672.0" y="242.0" font-size="18" fill="#edf4ff" text-anchor="middle">?</text><text x="630" y="310" font-size="17" fill="#edf4ff" text-anchor="middle">少量標籤＋未標籤</text></g></svg>