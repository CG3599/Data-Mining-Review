<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">全域頻繁，必須至少在一區域頻繁</title><desc id="desc">自編例，所有分區使用相同相對門檻 40%。X 在第一區域頻繁，全域也恰達門檻；局部頻繁不保證全域頻繁，所以合併候選後仍須全資料驗證。加總時按區域筆數加權。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">全域頻繁，必須至少在一區域頻繁</text><rect x="35" y="95" width="300" height="95" rx="8" fill="#192d46" stroke="#456585"/><text x="185.0" y="136.0" font-size="18" fill="#edf4ff" text-anchor="middle">Partition 1：4 筆</text><text x="185.0" y="161.0" font-size="18" fill="#edf4ff" text-anchor="middle">X 出現 3 次 → 75%</text><rect x="425" y="95" width="300" height="95" rx="8" fill="#192d46" stroke="#456585"/><text x="575.0" y="136.0" font-size="18" fill="#edf4ff" text-anchor="middle">Partition 2：6 筆</text><text x="575.0" y="161.0" font-size="18" fill="#edf4ff" text-anchor="middle">X 出現 1 次 → 16.7%</text><rect x="115" y="245" width="530" height="75" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="276.0" font-size="18" fill="#edf4ff" text-anchor="middle">全資料：10 筆，X 共出現 4 次</text><text x="380.0" y="301.0" font-size="18" fill="#edf4ff" text-anchor="middle">全域支持度 = 40%</text></g></svg>