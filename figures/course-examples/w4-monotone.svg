<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">項目越多，能符合條件的交易只會更少</title><desc id="desc">自編包含關係示例。所有包含 ABC 的交易一定包含 AB，所有包含 AB 的交易一定包含 A；這是 Apriori 反單調性與剪枝的依據。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">項目越多，能符合條件的交易只會更少</text><rect x="35" y="90" width="205" height="75" rx="8" fill="#192d46" stroke="#456585"/><text x="137.5" y="121.0" font-size="18" fill="#edf4ff" text-anchor="middle">{A} 的交易</text><text x="137.5" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">T1、T2、T3、T4</text><path d="M250,128 L285,128" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M278,123 L285,128 L278,133" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="295" y="90" width="180" height="75" rx="8" fill="#192d46" stroke="#456585"/><text x="385.0" y="121.0" font-size="18" fill="#edf4ff" text-anchor="middle">{A,B} 的交易</text><text x="385.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">T1、T3</text><path d="M485,128 L520,128" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M513,123 L520,128 L513,133" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="530" y="90" width="195" height="75" rx="8" fill="#192d46" stroke="#456585"/><text x="627.5" y="121.0" font-size="18" fill="#edf4ff" text-anchor="middle">{A,B,C} 的交易</text><text x="627.5" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">T3</text><text x="55" y="220" font-size="20" fill="#80dfbf" text-anchor="start">Count(A) = 4 ≥ Count(AB) = 2 ≥ Count(ABC) = 1</text><rect x="55" y="260" width="650" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="293.5" font-size="18" fill="#edf4ff" text-anchor="middle">若最低支持計數為 3，AB 不頻繁，ABC 可直接剪掉。</text></g></svg>