<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">支援向量限制分類邊界能留下多大間隔</title><desc id="desc">自編可線性分離的二維資料，未對應教材 B1/B2 的原始座標。兩條邊界間完整寬度為 2/‖w‖（標準化約束下）；每側距分類超平面為 1/‖w‖。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">支援向量限制分類邊界能留下多大間隔</text><path d="M380,80 L380,280" fill="none" stroke="#ffd17c" stroke-width="3"/><path d="M280,80 L280,280" fill="none" stroke="#adc1da" stroke-width="2" stroke-dasharray="6 5"/><path d="M480,80 L480,280" fill="none" stroke="#adc1da" stroke-width="2" stroke-dasharray="6 5"/><circle cx="180" cy="120" r="10" fill="#80dfbf"/><circle cx="210" cy="210" r="10" fill="#80dfbf"/><circle cx="280" cy="165" r="10" fill="#80dfbf"/><rect x="471" y="201" width="18" height="18" fill="#8ac6ff"/><rect x="551" y="121" width="18" height="18" fill="#8ac6ff"/><rect x="601" y="221" width="18" height="18" fill="#8ac6ff"/><circle cx="280" cy="165" r="19" fill="none" stroke="#ffd17c"/><circle cx="480" cy="210" r="19" fill="none" stroke="#ffd17c"/><text x="290" y="320" font-size="18" fill="#ffd17c" text-anchor="start">兩條虛線之間：完整間隔</text><text x="35" y="70" font-size="18" fill="#edf4ff" text-anchor="start">圈起者是支援向量；實線為分類邊界。</text></g></svg>