<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="title desc"><title id="title">Soft-margin：落進間隔不一定已經分錯</title><desc id="desc">自編左側類別示意。ξ=0 表示滿足間隔；0&lt;ξ&lt;1 為正確側但間隔不足；ξ&gt;1 才越過分類邊界。C 是對違反間隔的懲罰權重，不直接等於錯誤率。</desc><rect width="760" height="375" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">Soft-margin：落進間隔不一定已經分錯</text><path d="M380,90 L380,285" fill="none" stroke="#ffd17c" stroke-width="3"/><path d="M250,90 L250,285" fill="none" stroke="#adc1da" stroke-width="2" stroke-dasharray="6 5"/><path d="M510,90 L510,285" fill="none" stroke="#adc1da" stroke-width="2" stroke-dasharray="6 5"/><circle cx="150" cy="150" r="9" fill="#80dfbf"/><text x="35" y="130" font-size="16" fill="#80dfbf" text-anchor="start">間隔外：ξ = 0</text><circle cx="310" cy="210" r="9" fill="#80dfbf"/><text x="35" y="190" font-size="16" fill="#80dfbf" text-anchor="start">間隔內但分對：0 &lt; ξ &lt; 1</text><circle cx="440" cy="115" r="9" fill="#80dfbf"/><text x="465" y="95" font-size="16" fill="#80dfbf" text-anchor="start">分錯側：ξ &gt; 1</text><text x="35" y="330" font-size="17" fill="#edf4ff" text-anchor="start">以左側為正確類別；點的位置示意違反程度，不是實際求解結果。</text></g></svg>