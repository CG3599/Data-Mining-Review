<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">共變異數矩陣：先看對角線，再看成對關係</title><desc id="desc">自編三變數符號圖。對角線是各變數和自己計算的共變異數，也就是變異數；非對角線描述兩變數共同變動，不能把它直接當相關係數。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">共變異數矩陣：先看對角線，再看成對關係</text><rect x="95" y="95" width="110" height="52" rx="8" fill="#214b45" stroke="#456585"/><text x="150.0" y="127.0" font-size="18" fill="#edf4ff" text-anchor="middle">Var 1</text><rect x="215" y="95" width="110" height="52" rx="8" fill="#23344d" stroke="#456585"/><text x="270.0" y="127.0" font-size="18" fill="#edf4ff" text-anchor="middle">Cov(1,2)</text><rect x="335" y="95" width="110" height="52" rx="8" fill="#23344d" stroke="#456585"/><text x="390.0" y="127.0" font-size="18" fill="#edf4ff" text-anchor="middle">Cov(1,3)</text><rect x="95" y="157" width="110" height="52" rx="8" fill="#23344d" stroke="#456585"/><text x="150.0" y="189.0" font-size="18" fill="#edf4ff" text-anchor="middle">Cov(2,1)</text><rect x="215" y="157" width="110" height="52" rx="8" fill="#214b45" stroke="#456585"/><text x="270.0" y="189.0" font-size="18" fill="#edf4ff" text-anchor="middle">Var 2</text><rect x="335" y="157" width="110" height="52" rx="8" fill="#23344d" stroke="#456585"/><text x="390.0" y="189.0" font-size="18" fill="#edf4ff" text-anchor="middle">Cov(2,3)</text><rect x="95" y="219" width="110" height="52" rx="8" fill="#23344d" stroke="#456585"/><text x="150.0" y="251.0" font-size="18" fill="#edf4ff" text-anchor="middle">Cov(3,1)</text><rect x="215" y="219" width="110" height="52" rx="8" fill="#23344d" stroke="#456585"/><text x="270.0" y="251.0" font-size="18" fill="#edf4ff" text-anchor="middle">Cov(3,2)</text><rect x="335" y="219" width="110" height="52" rx="8" fill="#214b45" stroke="#456585"/><text x="390.0" y="251.0" font-size="18" fill="#edf4ff" text-anchor="middle">Var 3</text><text x="490" y="135" font-size="20" fill="#80dfbf" text-anchor="start">綠色對角線</text><text x="490" y="165" font-size="18" fill="#edf4ff" text-anchor="start">各變數的變異數</text><text x="490" y="225" font-size="18" fill="#8ac6ff" text-anchor="start">對角線兩側互相對稱</text><text x="70" y="330" font-size="18" fill="#edf4ff" text-anchor="start">Cov(X₁, X₂) = Cov(X₂, X₁)；數值仍受變數單位影響。</text></g></svg>