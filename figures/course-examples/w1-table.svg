<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">資料表：橫向讀一筆，縱向讀一種屬性</title><desc id="desc">自編顧客資料。ID 用於識別紀錄；年齡與城市描述顧客。資料以列和欄組織，不表示所有欄位都適合直接拿來計算距離。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">資料表：橫向讀一筆，縱向讀一種屬性</text><text x="30" y="85" font-size="19" fill="#ffd17c" text-anchor="start">每列：一位顧客；每欄：一種屬性</text><rect x="130" y="110" width="175" height="38" rx="8" fill="#244b60" stroke="#456585"/><text x="217.5" y="135.0" font-size="18" fill="#edf4ff" text-anchor="middle">顧客 ID</text><rect x="315" y="110" width="175" height="38" rx="8" fill="#244b60" stroke="#456585"/><text x="402.5" y="135.0" font-size="18" fill="#edf4ff" text-anchor="middle">年齡</text><rect x="500" y="110" width="175" height="38" rx="8" fill="#244b60" stroke="#456585"/><text x="587.5" y="135.0" font-size="18" fill="#edf4ff" text-anchor="middle">城市</text><rect x="130" y="154" width="175" height="38" rx="8" fill="#192d46" stroke="#456585"/><text x="217.5" y="179.0" font-size="18" fill="#edf4ff" text-anchor="middle">C01</text><rect x="315" y="154" width="175" height="38" rx="8" fill="#192d46" stroke="#456585"/><text x="402.5" y="179.0" font-size="18" fill="#edf4ff" text-anchor="middle">22</text><rect x="500" y="154" width="175" height="38" rx="8" fill="#192d46" stroke="#456585"/><text x="587.5" y="179.0" font-size="18" fill="#edf4ff" text-anchor="middle">臺中</text><rect x="130" y="198" width="175" height="38" rx="8" fill="#192d46" stroke="#456585"/><text x="217.5" y="223.0" font-size="18" fill="#edf4ff" text-anchor="middle">C02</text><rect x="315" y="198" width="175" height="38" rx="8" fill="#192d46" stroke="#456585"/><text x="402.5" y="223.0" font-size="18" fill="#edf4ff" text-anchor="middle">35</text><rect x="500" y="198" width="175" height="38" rx="8" fill="#192d46" stroke="#456585"/><text x="587.5" y="223.0" font-size="18" fill="#edf4ff" text-anchor="middle">臺北</text><rect x="130" y="242" width="175" height="38" rx="8" fill="#192d46" stroke="#456585"/><text x="217.5" y="267.0" font-size="18" fill="#edf4ff" text-anchor="middle">C03</text><rect x="315" y="242" width="175" height="38" rx="8" fill="#192d46" stroke="#456585"/><text x="402.5" y="267.0" font-size="18" fill="#edf4ff" text-anchor="middle">28</text><rect x="500" y="242" width="175" height="38" rx="8" fill="#192d46" stroke="#456585"/><text x="587.5" y="267.0" font-size="18" fill="#edf4ff" text-anchor="middle">高雄</text><text x="130" y="325" font-size="18" fill="#edf4ff" text-anchor="start">C02 這列是一個資料物件；「城市」這欄是一個屬性。</text></g></svg>