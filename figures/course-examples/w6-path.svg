<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc"><title id="title">單一路徑：列舉組合，再接上固定後綴</title><desc id="desc">依筆記的條件樹 b:2→a:2 與後綴 e 重繪。非空節點組合為 a、b、ab，得到 ae、be、abe；e 本身的支持度另由其原始計數決定。</desc><rect width="760" height="370" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">單一路徑：列舉組合，再接上固定後綴</text><rect x="35" y="100" width="195" height="150" rx="8" fill="#192d46" stroke="#456585"/><text x="132.5" y="156.0" font-size="18" fill="#edf4ff" text-anchor="middle">條件樹：單一路徑</text><text x="132.5" y="181.0" font-size="18" fill="#edf4ff" text-anchor="middle">根 → b:2 → a:2</text><text x="132.5" y="206.0" font-size="18" fill="#edf4ff" text-anchor="middle">固定後綴 e</text><path d="M240,175 L300,175" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M293,170 L300,175 L293,180" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="315" y="90" width="400" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="515.0" y="128.5" font-size="18" fill="#edf4ff" text-anchor="middle">單點組合：a → ae；b → be</text><rect x="315" y="175" width="400" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="515.0" y="213.5" font-size="18" fill="#edf4ff" text-anchor="middle">雙點組合：ab → abe</text><text x="315" y="285" font-size="20" fill="#80dfbf" text-anchor="start">上述組合的支持計數皆為 2</text><text x="35" y="330" font-size="18" fill="#edf4ff" text-anchor="start">一般單一路徑組合的計數，取所選節點計數的最小值。</text></g></svg>