<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc"><title id="title">類別屬性可以多路切，也可以分成兩組</title><desc id="desc">自編顏色屬性。多路分割各類一個分支；二元分割把類別集合分成兩群。這是不同的切分方案，哪個更好仍須按加權不純度與演算法規則評估。</desc><rect width="760" height="370" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">類別屬性可以多路切，也可以分成兩組</text><rect x="265" y="75" width="230" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="108.5" font-size="18" fill="#edf4ff" text-anchor="middle">類別屬性：顏色</text><path d="M380,130 L145,190" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="75" y="190" width="140" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="145.0" y="223.5" font-size="18" fill="#edf4ff" text-anchor="middle">紅</text><path d="M380,130 L380,190" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="310" y="190" width="140" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="223.5" font-size="18" fill="#edf4ff" text-anchor="middle">藍</text><path d="M380,130 L615,190" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="545" y="190" width="140" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="615.0" y="223.5" font-size="18" fill="#edf4ff" text-anchor="middle">綠</text><rect x="80" y="280" width="600" height="50" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="311.0" font-size="18" fill="#edf4ff" text-anchor="middle">也可二元分割：{紅} vs. {藍, 綠}</text></g></svg>