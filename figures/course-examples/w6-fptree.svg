<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="title desc"><title id="title">FP-Tree：相同前綴共享節點並累加次數</title><desc id="desc">自編三筆交易的完整樹，並非教材九筆交易的原圖。根不代表商品；節點計數代表經過該前綴的交易數，不能把樹的所有節點計數加總當交易總數。</desc><rect width="760" height="375" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">FP-Tree：相同前綴共享節點並累加次數</text><rect x="25" y="95" width="270" height="130" rx="8" fill="#192d46" stroke="#456585"/><text x="160.0" y="141.0" font-size="18" fill="#edf4ff" text-anchor="middle">三筆排序後交易</text><text x="160.0" y="166.0" font-size="18" fill="#edf4ff" text-anchor="middle">AB、AB、AC</text><text x="160.0" y="191.0" font-size="18" fill="#edf4ff" text-anchor="middle">固定全域順序 A → B → C</text><path d="M515,95 L515,155" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M515,180 L430,260" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M515,180 L630,260" fill="none" stroke="#8ac6ff" stroke-width="2"/><circle cx="515" cy="80" r="23" fill="#192d46" stroke="#8ac6ff" stroke-width="2"/><text x="515" y="86" font-size="18" fill="#edf4ff" text-anchor="middle">根</text><rect x="470" y="145" width="90" height="45" rx="8" fill="#192d46" stroke="#456585"/><text x="515.0" y="173.5" font-size="18" fill="#edf4ff" text-anchor="middle">A:3</text><rect x="385" y="250" width="90" height="45" rx="8" fill="#192d46" stroke="#456585"/><text x="430.0" y="278.5" font-size="18" fill="#edf4ff" text-anchor="middle">B:2</text><rect x="585" y="250" width="90" height="45" rx="8" fill="#192d46" stroke="#456585"/><text x="630.0" y="278.5" font-size="18" fill="#edf4ff" text-anchor="middle">C:1</text><text x="35" y="335" font-size="19" fill="#80dfbf" text-anchor="start">共用前綴 A 的計數為 3；分支 B=2、C=1。</text></g></svg>