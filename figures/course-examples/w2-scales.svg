<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">等距與比例尺度：零點的意義不同</title><desc id="desc">自編對照。攝氏零度不代表沒有熱力學溫度；公斤的零表示該重量為零。量尺決定哪些運算與敘述具有意義。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">等距與比例尺度：零點的意義不同</text><rect x="30" y="95" width="320" height="145" rx="8" fill="#192d46" stroke="#456585"/><text x="190.0" y="148.5" font-size="18" fill="#edf4ff" text-anchor="middle">攝氏溫度：等距尺度</text><text x="190.0" y="173.5" font-size="18" fill="#edf4ff" text-anchor="middle">10°C → 20°C</text><text x="190.0" y="198.5" font-size="18" fill="#edf4ff" text-anchor="middle">增加 10°C；不是熱力學溫度加倍</text><rect x="410" y="95" width="320" height="145" rx="8" fill="#192d46" stroke="#456585"/><text x="570.0" y="148.5" font-size="18" fill="#edf4ff" text-anchor="middle">重量：比例尺度</text><text x="570.0" y="173.5" font-size="18" fill="#edf4ff" text-anchor="middle">10 kg → 20 kg</text><text x="570.0" y="198.5" font-size="18" fill="#edf4ff" text-anchor="middle">真正零點；重量加倍</text><text x="55" y="305" font-size="21" fill="#80dfbf" text-anchor="start">能比較差值，不代表也能直接比較倍數。</text></g></svg>