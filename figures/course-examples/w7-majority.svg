<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" role="img" aria-labelledby="title desc"><title id="title">特徵用完仍混雜：用多數類別決定葉節點</title><desc id="desc">依教材 YES、YES、YES、NO 重繪。當沒有可用特徵繼續切分，採多數類 YES；不要把這個多數決葉誤認成純節點。</desc><rect width="760" height="355" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">特徵用完仍混雜：用多數類別決定葉節點</text><rect x="45" y="110" width="90" height="60" rx="8" fill="#214b45" stroke="#456585"/><text x="90.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">YES</text><rect x="150" y="110" width="90" height="60" rx="8" fill="#214b45" stroke="#456585"/><text x="195.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">YES</text><rect x="255" y="110" width="90" height="60" rx="8" fill="#214b45" stroke="#456585"/><text x="300.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">YES</text><rect x="360" y="110" width="90" height="60" rx="8" fill="#472b38" stroke="#456585"/><text x="405.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">NO</text><path d="M470,140 L520,140" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M513,135 L520,140 L513,145" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="540" y="100" width="180" height="80" rx="8" fill="#192d46" stroke="#456585"/><text x="630.0" y="133.5" font-size="18" fill="#edf4ff" text-anchor="middle">多數決葉節點</text><text x="630.0" y="158.5" font-size="18" fill="#edf4ff" text-anchor="middle">預測 YES</text><text x="50" y="255" font-size="21" fill="#ffd17c" text-anchor="start">3 票對 1 票；該葉節點仍有 1/4 訓練樣本分錯。</text><text x="50" y="305" font-size="18" fill="#edf4ff" text-anchor="start">停止切分，不代表已把所有訓練資料完全分類正確。</text></g></svg>