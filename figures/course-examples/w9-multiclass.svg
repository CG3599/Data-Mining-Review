<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">多類 SVM：一對其餘與兩兩對戰</title><desc id="desc">依教材四類數量例重繪。OvR 每類建一個分類器；OvO 每個無序類別配對建一個。圖上列的是子問題，最後仍需彙整分數或投票。</desc><rect width="760" height="350" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">多類 SVM：一對其餘與兩兩對戰</text><text x="35" y="85" font-size="20" fill="#ffd17c" text-anchor="start">四個類別 A、B、C、D</text><rect x="35" y="120" width="165" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="117.5" y="153.5" font-size="18" fill="#edf4ff" text-anchor="middle">A vs. BCD</text><rect x="215" y="120" width="165" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="297.5" y="153.5" font-size="18" fill="#edf4ff" text-anchor="middle">B vs. ACD</text><rect x="35" y="190" width="165" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="117.5" y="223.5" font-size="18" fill="#edf4ff" text-anchor="middle">C vs. ABD</text><rect x="215" y="190" width="165" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="297.5" y="223.5" font-size="18" fill="#edf4ff" text-anchor="middle">D vs. ABC</text><rect x="425" y="120" width="95" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="472.5" y="153.5" font-size="18" fill="#edf4ff" text-anchor="middle">A–B</text><rect x="530" y="120" width="95" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="577.5" y="153.5" font-size="18" fill="#edf4ff" text-anchor="middle">A–C</text><rect x="635" y="120" width="95" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="682.5" y="153.5" font-size="18" fill="#edf4ff" text-anchor="middle">A–D</text><rect x="425" y="190" width="95" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="472.5" y="223.5" font-size="18" fill="#edf4ff" text-anchor="middle">B–C</text><rect x="530" y="190" width="95" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="577.5" y="223.5" font-size="18" fill="#edf4ff" text-anchor="middle">B–D</text><rect x="635" y="190" width="95" height="55" rx="8" fill="#192d46" stroke="#456585"/><text x="682.5" y="223.5" font-size="18" fill="#edf4ff" text-anchor="middle">C–D</text><text x="75" y="310" font-size="21" fill="#80dfbf" text-anchor="start">OvR：4 個分類器</text><text x="445" y="310" font-size="21" fill="#8ac6ff" text-anchor="start">OvO：4×3/2 = 6 個</text></g></svg>