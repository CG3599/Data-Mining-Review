<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">改變 k，就可能改變投票結果</title><desc id="desc">自編鄰居順序，採不加權多數決。較小 k 更受局部樣本影響；較大 k 會納入更遠的樣本。這裡只示範單一查詢點，不代表增大 k 必然提升準確率。</desc><rect width="760" height="350" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">改變 k，就可能改變投票結果</text><text x="35" y="90" font-size="20" fill="#edf4ff" text-anchor="start">距離由近到遠：</text><rect x="35" y="125" width="88" height="65" rx="8" fill="#214b45" stroke="#456585"/><text x="79.0" y="151.0" font-size="18" fill="#edf4ff" text-anchor="middle">1 號鄰居</text><text x="79.0" y="176.0" font-size="18" fill="#edf4ff" text-anchor="middle">A</text><rect x="138" y="125" width="88" height="65" rx="8" fill="#40364e" stroke="#456585"/><text x="182.0" y="151.0" font-size="18" fill="#edf4ff" text-anchor="middle">2 號鄰居</text><text x="182.0" y="176.0" font-size="18" fill="#edf4ff" text-anchor="middle">B</text><rect x="241" y="125" width="88" height="65" rx="8" fill="#40364e" stroke="#456585"/><text x="285.0" y="151.0" font-size="18" fill="#edf4ff" text-anchor="middle">3 號鄰居</text><text x="285.0" y="176.0" font-size="18" fill="#edf4ff" text-anchor="middle">B</text><rect x="344" y="125" width="88" height="65" rx="8" fill="#214b45" stroke="#456585"/><text x="388.0" y="151.0" font-size="18" fill="#edf4ff" text-anchor="middle">4 號鄰居</text><text x="388.0" y="176.0" font-size="18" fill="#edf4ff" text-anchor="middle">A</text><rect x="447" y="125" width="88" height="65" rx="8" fill="#40364e" stroke="#456585"/><text x="491.0" y="151.0" font-size="18" fill="#edf4ff" text-anchor="middle">5 號鄰居</text><text x="491.0" y="176.0" font-size="18" fill="#edf4ff" text-anchor="middle">B</text><rect x="550" y="125" width="88" height="65" rx="8" fill="#214b45" stroke="#456585"/><text x="594.0" y="151.0" font-size="18" fill="#edf4ff" text-anchor="middle">6 號鄰居</text><text x="594.0" y="176.0" font-size="18" fill="#edf4ff" text-anchor="middle">A</text><rect x="653" y="125" width="88" height="65" rx="8" fill="#214b45" stroke="#456585"/><text x="697.0" y="151.0" font-size="18" fill="#edf4ff" text-anchor="middle">7 號鄰居</text><text x="697.0" y="176.0" font-size="18" fill="#edf4ff" text-anchor="middle">A</text><rect x="35" y="240" width="200" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="135.0" y="266.0" font-size="18" fill="#edf4ff" text-anchor="middle">k=1：A 1 票</text><text x="135.0" y="291.0" font-size="18" fill="#edf4ff" text-anchor="middle">預測 A</text><rect x="280" y="240" width="200" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="380.0" y="266.0" font-size="18" fill="#edf4ff" text-anchor="middle">k=3：B 2 票</text><text x="380.0" y="291.0" font-size="18" fill="#edf4ff" text-anchor="middle">預測 B</text><rect x="525" y="240" width="200" height="65" rx="8" fill="#192d46" stroke="#456585"/><text x="625.0" y="266.0" font-size="18" fill="#edf4ff" text-anchor="middle">k=7：A 4 票</text><text x="625.0" y="291.0" font-size="18" fill="#edf4ff" text-anchor="middle">預測 A</text></g></svg>