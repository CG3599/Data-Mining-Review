<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">純節點：目前資料已沒有類別不確定性</title><desc id="desc">以教材的四筆 YES 概念重繪。節點純淨描述的是落入此節點的訓練資料，不保證所有未來資料都會分類正確。</desc><rect width="760" height="360" rx="12" fill="#0d1b2c"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="38" font-size="23" fill="#8ac6ff" text-anchor="start">純節點：目前資料已沒有類別不確定性</text><rect x="45" y="110" width="90" height="60" rx="8" fill="#214b45" stroke="#456585"/><text x="90.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">YES</text><rect x="150" y="110" width="90" height="60" rx="8" fill="#214b45" stroke="#456585"/><text x="195.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">YES</text><rect x="255" y="110" width="90" height="60" rx="8" fill="#214b45" stroke="#456585"/><text x="300.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">YES</text><rect x="360" y="110" width="90" height="60" rx="8" fill="#214b45" stroke="#456585"/><text x="405.0" y="146.0" font-size="18" fill="#edf4ff" text-anchor="middle">YES</text><path d="M470,140 L520,140" fill="none" stroke="#8ac6ff" stroke-width="2"/><path d="M513,135 L520,140 L513,145" fill="none" stroke="#8ac6ff" stroke-width="2"/><rect x="540" y="100" width="180" height="80" rx="8" fill="#192d46" stroke="#456585"/><text x="630.0" y="133.5" font-size="18" fill="#edf4ff" text-anchor="middle">葉節點</text><text x="630.0" y="158.5" font-size="18" fill="#edf4ff" text-anchor="middle">預測 YES</text><text x="50" y="260" font-size="21" fill="#80dfbf" text-anchor="start">同一類別占 100%：Entropy = 0，Gini = 0。</text><text x="50" y="310" font-size="18" fill="#edf4ff" text-anchor="start">這個訓練節點已純淨，不必為區分類別而繼續分割。</text></g></svg>