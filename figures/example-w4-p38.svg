<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>用支持計數區分封閉與極大</title><desc>例：交易為 AB、AB、AB、AC，門檻為 2 次。A 的真超集都少於 4 次，但 AB 仍頻繁；AB 已沒有頻繁真超集。</desc><rect x="14" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="95" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">項目集</text><rect x="186" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="267" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">支持計數</text><rect x="358" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="439" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">判別</text><rect x="14" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">A</text><rect x="186" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">4</text><rect x="358" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">封閉、非極大</text><rect x="14" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">AB</text><rect x="186" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">3</text><rect x="358" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">極大且封閉</text><rect x="14" y="125" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="147" fill="#e8f1ff" font-size="16" text-anchor="middle">AC</text><rect x="186" y="125" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="147" fill="#e8f1ff" font-size="16" text-anchor="middle">1</text><rect x="358" y="125" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="147" fill="#e8f1ff" font-size="16" text-anchor="middle">不頻繁</text></svg>
