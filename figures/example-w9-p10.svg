<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>量尺會改變最近鄰</title><desc>直接用原單位算歐氏距離，B 較近。若收入改以千元計，A 的距離約 1.41，B 約 8.00。先選擇合理尺度再比較。</desc><rect x="14" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="95" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">與查詢點的差</text><rect x="186" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="267" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">年齡差</text><rect x="358" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="439" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">收入差</text><rect x="14" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">候選 A</text><rect x="186" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">1 歲</text><rect x="358" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">1000 元</text><rect x="14" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">候選 B</text><rect x="186" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">8 歲</text><rect x="358" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">100 元</text></svg>
