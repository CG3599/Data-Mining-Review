<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>兩班合併時，平均要按人數加權</title><desc>總分為 10 × 90 + 30 × 70 = 3000。除以 40 人得 75 分，直接平均兩班分數會得到 80。</desc><rect x="14" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="95" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">班級</text><rect x="186" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="267" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">人數</text><rect x="358" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="439" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">平均分數</text><rect x="14" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">甲</text><rect x="186" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">10</text><rect x="358" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">90</text><rect x="14" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">乙</text><rect x="186" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">30</text><rect x="358" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">70</text><rect x="14" y="125" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="147" fill="#e8f1ff" font-size="16" text-anchor="middle">合併</text><rect x="186" y="125" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="147" fill="#e8f1ff" font-size="16" text-anchor="middle">40</text><rect x="358" y="125" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="147" fill="#e8f1ff" font-size="16" text-anchor="middle">75</t