<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 169" font-family="Microsoft JhengHei, sans-serif" role="img"><title>條件樣式基底要保留路徑次數</title><desc>只追蹤通往後綴 m 的路徑。兩條前綴都有 a，所以 {a,m} 的支持計數為 2 + 4 = 6。</desc><rect x="14" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="95" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">m 的前綴路徑</text><rect x="186" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="267" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">路徑次數</text><rect x="358" y="8" width="163" height="33" rx="5" fill="#254871"/><text x="439" y="30" fill="#e8f1ff" font-size="16" text-anchor="middle">對 a 的貢獻</text><rect x="14" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">a → b</text><rect x="186" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">2</text><rect x="358" y="47" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="69" fill="#e8f1ff" font-size="16" text-anchor="middle">2</text><rect x="14" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">a → c</text><rect x="186" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">4</text><rect x="358" y="86" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="108" fill="#e8f1ff" font-size="16" text-anchor="middle">4</text><rect x="14" y="125" width="163" height="33" rx="5" fill="#182b40"/><text x="95" y="147" fill="#e8f1ff" font-size="16" text-anchor="middle">合計</text><rect x="186" y="125" width="163" height="33" rx="5" fill="#182b40"/><text x="267" y="147" fill="#e8f1ff" font-size="16" text-anchor="middle">6</text><rect x="358" y="125" width="163" height="33" rx="5" fill="#182b40"/><text x="439" y="147" fill="#e8f1ff" font-size="16" text-anchor="middle">6</text></svg>
